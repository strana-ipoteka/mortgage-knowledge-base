name: Проверка синхронизации — Банки России 3.0

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать обновления на сайте (true только после проверки)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-bank-memo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Refresh memo data
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          SYNC_CONTACTS: 'false'
          STRICT_SYNC: 'true'
          DRY_RUN: ${{ inputs.publish != true }}
        run: python scripts/sync_banks.py
      - name: Commit validated updates (only when publish is confirmed)
        if: ${{ inputs.publish == true }}
        run: |
          git add memo-data.js
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Обновление памятки из Google Таблицы"
            git push
          fi
