<!DOCTYPE html>
<html lang="ru"><head><link rel="icon" type="image/png" href="https://mikhailshevelev-dotcom.github.io/UOiI/favicon.png"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Памятка «Банки России 3.0»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&subset=cyrillic&display=swap">
<script src="./site-theme.js?v=5"></script>
<style>
:root{--bg:#f3f4f8;--sf:#fff;--tx:#29303e;--mu:#6b7285;--bb:#951b81;--bl:#f5e9f3;--bm:#e0c6db;--fu:#c7017f;--fl:#fde6f2;--ln:#e3e5ed;--thb:#951b81;--gr:linear-gradient(120deg,#831f82,#c7017f 60%,#e30613);--sh:0 2px 10px rgba(41,48,62,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c212b;--sf:#272d3a;--tx:#eceef4;--mu:#a3a9bb;--bb:#e08fd2;--bl:#3a2c3b;--bm:#5a4358;--fu:#f06bb4;--fl:#47263c;--ln:#363d4d;--thb:#7a1a6c;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c212b;--sf:#272d3a;--tx:#eceef4;--mu:#a3a9bb;--bb:#e08fd2;--bl:#3a2c3b;--bm:#5a4358;--fu:#f06bb4;--fl:#47263c;--ln:#363d4d;--thb:#7a1a6c;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--fu)}mark{background:var(--fl);color:var(--fu);border-radius:3px;padding:0 2px;font-weight:600}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{display:flex;gap:8px;align-items:center;max-width:1200px;margin:auto;padding:10px 14px}
.logo{font-weight:700;color:var(--tx);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:10px;font-size:14px}.brand{max-width:1200px;margin:auto;padding:16px 14px 6px}.brand img{height:30px;width:auto;display:block}.logo i{color:var(--fu);font-style:normal}
.sr{flex:1;position:relative}.sr input{width:100%;padding:10px 36px 10px 14px;border:1.5px solid var(--bm);border-radius:14px;background:var(--sf);color:var(--tx);font-family:inherit;font-size:inherit;outline:0}
.sr input:focus{border-color:var(--fu)}.sr button{position:absolute;right:6px;bottom:6px;border:0;background:var(--bl);color:var(--bb);width:26px;height:26px;border-radius:50%;cursor:pointer;display:none}
.btn{border:1.5px solid var(--bm);background:var(--sf);color:var(--bb);border-radius:14px;padding:9px 12px;font-family:inherit;font-size:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn b{background:var(--fu);color:#fff;border-radius:10px;padding:0 7px;margin-left:4px;font-size:12px}.btn.on{background:var(--bl)}
.panel{max-width:1200px;margin:auto;padding:0 14px 12px}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bm);background:var(--sf);color:var(--tx);border-radius:20px;padding:4px 11px;font-family:inherit;font-size:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--bb);color:#fff;border-color:var(--bb)}.lnk{background:none;border:0;color:var(--fu);font-family:inherit;font-size:inherit;cursor:pointer;padding:8px 0 0;font-weight:600}
main{max-width:1200px;margin:auto;padding:16px 14px 60px}
.hero{background:var(--gr);color:#fff;border-radius:22px;padding:22px;margin-bottom:18px}
.hero h1{margin:0 0 6px;font-size:24px;color:#fff}.hero p{margin:0;color:rgba(255,255,255,.9)}.st{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.st span{background:rgba(255,255,255,.95);color:#29303e;border-radius:12px;padding:6px 12px;font-size:13px;color:var(--mu)}.st b{color:var(--fu);font-size:16px}
.grp{margin:22px 0 10px}.grp h2{margin:0;font-size:17px;color:var(--bb)}.grp p{margin:0;color:var(--mu);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{display:block;text-decoration:none;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--bb);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.g1 .tile,.g3 .tile{border-left-color:var(--fu)}.tile:hover{border-color:var(--fu)}.tile b{display:block}.tile small{color:var(--mu);display:block}.tile em{font-style:normal;color:var(--fu);font-size:12px;font-weight:600}
.back{display:inline-block;margin-bottom:10px;color:var(--bb);font-weight:600;text-decoration:none}
h2.sh{margin:6px 0 2px;color:var(--bb);font-size:21px}.sub{color:var(--mu);margin:0 0 10px}
.info{background:var(--bl);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:16px;color:var(--bb);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card h3 small{background:var(--fl);color:var(--fu);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600}
dl{margin:0;display:grid;gap:7px}dl div{border-top:1px dashed var(--ln);padding-top:6px}dt{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.02em}dd{margin:0;overflow-wrap:anywhere}
dl.more{margin-top:10px;border-top:2px solid var(--bm);padding-top:8px}
.pill{border-radius:10px;padding:1px 10px;font-weight:600;font-size:13px;background:var(--bl);color:var(--bb)}.pill.n{background:var(--ln);color:var(--mu)}.pill.s{background:var(--fu);color:#fff}
.note{background:var(--sf);border:1px solid var(--bm);border-left:4px solid var(--fu);border-radius:12px;padding:10px 14px;margin:0 0 12px;grid-column:1/-1}.note.h{font-weight:700;color:var(--bb);background:var(--bl);border-color:var(--bl)}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;max-height:75vh}
table{border-collapse:separate;border-spacing:0;font-size:14px;line-height:1.45;width:max-content;min-width:100%}tbody tr:nth-child(even) td{background:var(--bg)}tbody tr:hover td{background:var(--bl)}td.c{text-align:center}
th,td{border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);padding:10px 12px;vertical-align:top;min-width:96px;max-width:320px}th{font-size:12.5px;line-height:1.3}
th{position:sticky;top:0;background:var(--thb);color:#fff;z-index:2;text-align:left}td:first-child,th:first-child{position:sticky;left:0;background:var(--sf);z-index:1;font-weight:600;min-width:120px;max-width:200px;box-shadow:2px 0 4px rgba(41,48,62,.06)}tbody tr:nth-child(even) td:first-child{background:var(--bg)}th:first-child{background:var(--thb);color:#fff;z-index:3}
tr.sub td{background:var(--fl);color:var(--fu);font-weight:700}td.x{color:var(--bm);text-align:center}td.span{max-width:none;white-space:normal;background:var(--bg)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
footer{color:var(--mu);font-size:12px;margin-top:22px}
@media (max-width:600px){.hero h1{font-size:20px}.logo span{display:none}}

.memo-return{position:sticky;top:0;z-index:12;padding:9px max(14px,calc((100vw - 1200px)/2 + 14px));background:var(--bg);border-bottom:1px solid var(--ln)}.memo-return a{display:inline-block;background:var(--sf);color:var(--bb);border:1px solid var(--bm);border-radius:12px;padding:8px 14px;text-decoration:none;font-weight:700;font-size:14px}.memo-return a:hover{border-color:var(--fu);color:var(--fu)}

#theme{margin-left:auto;min-width:86px}

/* Общий стиль страниц базы знаний, без изменений логики и сетки банков */
:root[data-theme="light"]{--bg:#f8f6f8;--sf:#fff;--tx:#261e2c;--mu:#766b79;--ln:#e9e3ea;--bb:#9b287f}
:root[data-theme="dark"]{--bg:#1b2029;--sf:#262b36;--tx:#f0edf3;--mu:#b7aab8;--ln:#42404e;--bb:#e389c6}
body{font-family:Inter,Montserrat,"Segoe UI",Arial,sans-serif}
.memo-return{position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:70px;background:var(--sf);border-bottom:1px solid var(--ln);padding:14px max(24px,calc((100vw - 1160px)/2 + 24px))}
.memo-return a{background:none;border:0;color:var(--bb);border-radius:0;padding:0;font-size:13px}
.memo-headtools{display:flex;align-items:center;gap:12px}
.memo-wordmark{font-weight:850;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--bb)}
.memo-theme{font-family:inherit;font-size:13px;font-weight:700;border-radius:11px;border:1px solid #e5d0df;color:#9b287f;background:#f6edf4;padding:10px 14px;cursor:pointer;white-space:nowrap}
.memo-theme:hover{border-color:#c88fbb;background:#f9edf6}
:root[data-theme="dark"] .memo-theme{background:#35283a;border-color:#5b3e57;color:#efb1dd}
.brand{max-width:1160px}
.brand img{height:24px}
.top{background:var(--bg);border-color:var(--ln)}
.bar,.panel,main{max-width:1160px}
.btn{border-radius:12px}
.sr input{background:var(--sf);border-color:var(--ln);color:var(--tx);border-radius:12px}
.hero{border-radius:24px}
.tile{border-radius:18px;border-color:var(--ln);background:var(--sf);box-shadow:0 7px 28px #31123508}
.tile:hover{box-shadow:0 15px 40px #31123512}
.chip{border-radius:14px}
@media(max-width:670px){.memo-return{padding:14px;min-height:62px}.memo-wordmark{font-size:10px}.memo-headtools{gap:7px}.memo-theme{padding:9px;font-size:12px}}
</style>
<link rel="stylesheet" href="./site-consistency.css?v=1"><link rel="stylesheet" href="./uoii-reference-style.css?v=3">
<style>
.memo-pagehead { position: relative }
body:has(.memo-return) .memo-pagehead { margin-bottom: 22px }
body:has(.memo-return) .memo-pagehead p { margin-bottom: 10px }
.memo-source { font-size: 14px; font-weight: 600; text-underline-offset: 3px }
.memo-tools { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 16px; margin-bottom: 22px }
.memo-toolbar { display: flex; align-items: end; gap: 10px }
.memo-toolbar .sr { min-width: 0 }
.memo-toolbar .sr label { display: block; margin: 0 0 4px; font-size: 14px; font-weight: 600 }
.memo-toolbar input, .memo-toolbar .btn { min-height: 44px }
.memo-toolbar input::-webkit-search-cancel-button { display: none }
.memo-toolbar .sr button { width: 32px; height: 32px }
.memo-bank-panel { max-height: 230px; overflow-y: auto; margin-top: 12px }
.memo-bank-panel .chip { min-height: 36px; font-size: 14px }
.chip.on { background: var(--fl); color: var(--bb); border-color: var(--bb) }
.memo-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px }
.memo-filters[hidden] { display: none }
.memo-filters button { min-height: 32px }
.memo-filters .lnk { padding: 4px 6px; font-size: 14px }
.memo-status { color: var(--mu); margin: 0 0 12px; font-size: 14px }
.memo-status:empty { display: none }
.memo-catalog section + section { margin-top: 25px }
.memo-catalog h2, .memo-results h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.3 }
.memo-catalog section > p { margin: 0 0 10px; color: var(--mu); font-size: 14px }
.memo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 235px), 1fr)); gap: 10px }
.memo-entry { display: grid; gap: 4px; padding: 12px 15px; border: 1px solid var(--line); border-left: 4px solid var(--purple); border-radius: 12px; background: var(--surface); color: var(--tx); text-decoration: none; overflow-wrap: anywhere }
.memo-entry:hover { border-color: var(--accent) }
.memo-entry small { color: var(--mu); font-size: 14px }
.memo-section-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 18px }
.memo-section-nav label { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px }
.memo-section-nav select { max-width: 100%; min-height: 42px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--tx); font: inherit }
.memo-section .sub { margin-bottom: 16px }
.memo-more { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px }
.memo-section dt { font-size: 13px }
.memo-card-details { margin: 10px 0 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 8px 0 0 }
.memo-card-details summary { color: var(--bb); min-height: 30px }
.memo-card-details[open] summary { margin-bottom: 8px }
.memo-cell-note { margin-top: 5px; text-align: left; white-space: normal; font-size: 14px; font-weight: 400 }
.memo-cell-note > summary { min-height: 28px; width: fit-content; cursor: pointer; font-weight: 600 }
.memo-cell-note > div { padding: 6px 9px; border: 1px solid currentColor; border-radius: 8px; overflow-wrap: anywhere }
.memo-cell-note a { color: inherit; text-decoration: underline }
.memo-table-hint { color: var(--mu); margin: 0 0 8px; font-size: 14px }
.tw { overflow: auto; max-height: min(75vh, 640px) }
.tw td { overflow-wrap: anywhere }
.subsidy-table table { width: 100%; table-layout: fixed }
.subsidy-table :is(th, td) { min-width: 0; max-width: none; padding: 8px 6px; overflow-wrap: anywhere }
.subsidy-table :is(th, td):first-child { width: 112px }
.subsidy-table th:nth-child(2) { width: 64px }
.subsidy-table th:nth-child(3) { width: 76px }
.subsidy-table :is(th, td):nth-child(n + 2) { text-align: center }
.subsidy-table th .bank-logo { display: block; margin: 0 auto 4px }
.subsidy-table td .memo-cell-note { font-size: 13px }
.subsidy-cards { display: none }
.loyalty-program, .loyalty-info { margin: 0 0 12px; padding: 14px; border: 1px solid var(--ln); border-radius: 12px; background: var(--sf) }
.loyalty-program h3, .loyalty-program > summary, .loyalty-info > summary { margin: 0; font-size: 16px; font-weight: 700 }
.loyalty-program > summary, .loyalty-info > summary { cursor: pointer }
.loyalty-program > summary small { margin-inline-start: 6px; color: var(--mu); font-weight: 400 }
.loyalty-info > div, .loyalty-program .loyalty-context { margin: 10px 0 0; overflow-wrap: anywhere }
.loyalty-context { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center }
.loyalty-context > div { display: flex; align-items: baseline; gap: 6px }
.loyalty-context dd { margin: 0; font-weight: 600 }
.loyalty-table { margin-top: 12px; max-height: none }
.loyalty-table table { width: 100%; table-layout: fixed }
.loyalty-table :is(th, td) { min-width: 0; max-width: none; padding: 8px; overflow-wrap: anywhere }
.loyalty-table :is(th, td):first-child { width: 12% }
.loyalty-rows { display: none }
@media (max-width: 759px) {
  .loyalty-table { display: none }
  .loyalty-rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 8px; margin-top: 12px }
  .loyalty-rows .card { margin: 0; min-width: 0; padding: 10px }
  .loyalty-rows .card > .memo-cell-note { margin-bottom: 8px }
}
@media (max-width: 919px) {
  .subsidy-table { display: none }
  .subsidy-cards { display: grid; gap: 10px }
  .subsidy-option { min-width: 0; padding: 12px; border: 1px solid var(--ln); border-radius: 12px; background: var(--sf) }
  .subsidy-option h3 { margin: 0 0 8px; font-size: 15px }
  .subsidy-option > summary { min-height: 28px; cursor: pointer; font-weight: 700 }
  .subsidy-option[open] > summary { margin-bottom: 8px }
  .subsidy-option dl { display: grid; margin: 0; gap: 6px 10px }
  .subsidy-terms { grid-template-columns: minmax(0, 1.5fr) minmax(0, .65fr) minmax(0, .85fr) }
  .subsidy-option dt { color: var(--mu); font-size: 13px; line-height: 1.3 }
  .subsidy-option dd { margin: 3px 0 0; font-weight: 600; overflow-wrap: anywhere }
  .subsidy-option .subsidy-banks { grid-template-columns: repeat(auto-fit, minmax(min(100%, 10.75rem), 1fr)) }
  .subsidy-banks > div { min-width: 0; padding: 7px 8px; border-radius: 8px; background: var(--bg) }
  .subsidy-banks dt { color: var(--tx); font-weight: 600; overflow-wrap: anywhere }
  .subsidy-banks dd { margin-top: 5px }
  .subsidy-option .subsidy-terms + h3 { margin-top: 12px }
  .subsidy-option p { margin: 12px 0 0; color: var(--mu) }
  .subsidy-cards .note { margin: 0 }
}
.memo-tools :focus-visible, .memo-results :focus-visible, .memo-catalog :focus-visible, .memo-section :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
@media (max-width: 580px) {
  .memo-tools { padding: 12px }
  .memo-toolbar { gap: 6px }
  .memo-toolbar .btn { padding-inline: 9px }
  .memo-grid { grid-template-columns: 1fr }
  .memo-section-nav { align-items: flex-start }
  .memo-section-nav label { width: 100% }
  .memo-section-nav select { width: 100% }
}
</style>

<script>
const $ = selector => document.querySelector(selector);
const app = $('#app');
const query = $('#q');
const bankFilter = $('#bb');
const data = window.MEMO_DATA;

if (!data) {
  $('.memo-tools').hidden = true;
  $('#status').textContent = 'Памятка не загрузилась. Условия доступны в Google Таблице.';
} else {
  initMemo(data);
}

function initMemo({ secs, groups, banks }) {
  const state = { query: '', banks: new Set() };
  const bankNames = new Map(banks.map(bank => [bank.id, bank.n]));
  const sheetIds = {
    s0: 0, s1: 1580280998, s2: 330286105, s3: 292621505, s4: 2143169685,
    s5: 1123676935, s6: 1297562849, s7: 860172231, s8: 558231179, s9: 2109045961,
    s10: 1163106320, s11: 808915854, s12: 31258751, s13: 832103270, s14: 2110526252,
    s15: 623330971, s16: 277931211, s17: 1899907639, s18: 153621334,
    s20: 1016212115
  };
  const source = $('#source');
  const sourceUrl = new URL(source.href);
  const normal = text => String(text ?? '').toLowerCase().replace(/ё/g, 'е');
  const capitalAlias = /мат[.\s]*(?:еринский\s+)?кап(?:итал)?|(?<![а-яё])мск(?![а-яё])/giu;
  const searchable = text => normal(text).replace(capitalAlias, 'маткапитал');
  const isEmpty = value => ['', 'х', 'x'].includes(normal(value).trim());
  const familySubsidy = section => section.id === 's10' || section.id === 's11';
  const esc = text => String(text ?? '').replace(/[&<>"]/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
  })[ch]);
  const safeRegex = text => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let terms = [];
  let highlight = null;

  function matches(text) {
    const value = searchable(text);
    return terms.every(term => value.includes(term));
  }

  function richText(text) {
    return String(text ?? '').split(/(https?:\/\/\S+)/g).map((part, index) => {
      if (index % 2) return `<a href="${esc(part)}" target="_blank" rel="noopener">Открыть ссылку</a>`;
      return (highlight
        ? part.split(highlight).map((fragment, j) => j % 2 ? `<mark>${esc(fragment)}</mark>` : esc(fragment)).join('')
        : esc(part)).replace(/\n/g, '<br>');
    }).join('');
  }

  function filterSection(section, inSearch) {
    const selected = state.banks;
    const byBank = selected.size > 0;
    const hasBankColumns = Boolean(section.bc);
    const hasBankTags = section.banks.length > 0;
    const filterUnavailable = byBank && !hasBankTags && !hasBankColumns;
    const result = { count: 0, items: [], rows: [], columns: [], filterUnavailable };
    if (byBank && hasBankTags && !hasBankColumns && !section.banks.some(bank => selected.has(bank))) return result;
    if (inSearch && filterUnavailable) return result;

    const sectionText = [section.t, section.d, ...(section.notes ?? []).flat()].join(' ');
    if (section.kind === 'loyalty') {
      result.info = section.info.filter(item => matches([sectionText, item.title, item.text].join(' ')));
      result.programs = section.programs.map(program => {
        const context = [sectionText, program.name, program.bank, program.downPayment, program.term, ...program.head.flat()].join(' ');
        return { ...program, rows: program.rows.filter(row => matches([context, ...row].join(' '))) };
      }).filter(program => program.rows.length);
      result.count = result.programs.reduce((count, program) => count + program.rows.length, 0)
        + (terms.length ? result.info.length : 0);
      return result;
    }
    if (section.kind === 'cards') {
      result.items = section.items.flatMap(item => {
        if (item.t === 'note') {
          const show = terms.length ? matches([sectionText, item.x, item.note].join(' ')) : !inSearch;
          return !byBank && show ? [item] : [];
        }
        if (byBank && !item.b.some(bank => selected.has(bank))) return [];
        const entries = byBank && item.kb ? item.kv.filter((_, index) =>
          item.kb[index]?.some(bank => selected.has(bank))) : item.kv;
        const text = byBank && item.kb
          ? [item.n, item.g, ...entries.flat(), ...item.more.flat(2)].join(' ')
          : `${item.s} ${item.n} ${item.b.map(bank => bankNames.get(bank)).join(' ')}`;
        return matches([sectionText, text, item.note].join(' ')) ? [{ ...item, kv: entries }] : [];
      });
      result.count = result.items.filter(item => terms.length || item.t !== 'note').length;
      return result;
    }

    const width = section.head.length || Math.max(0, ...section.rows.map(row => row.c.length));
    result.columns = Array.from({ length: width }, (_, index) => index);
    if (familySubsidy(section)) {
      result.columns = result.columns.filter(index =>
        index < section.lab || section.head[index].startsWith('КВ ·'));
    }
    if (byBank && hasBankColumns) {
      result.columns = result.columns.filter(index =>
        index < section.lab || section.bc[index]?.some(bank => selected.has(bank)));
    }
    const bankColumns = byBank && hasBankColumns ? result.columns.filter(index => index >= section.lab) : [];
    if (byBank && hasBankColumns && !bankColumns.length) return result;
    const headers = result.columns.flatMap(index => [section.head[index], section.headerNotes?.[index]]).join(' ');
    let blockHeading;
    for (const row of section.rows) {
      if (row.span) {
        if (matches([sectionText, row.c[0], row.notes?.[0]].join(' '))) {
          result.rows.push(row);
          if (terms.length) result.count++;
        }
        continue;
      }
      if (row.sub) {
        if (!terms.length && !byBank) result.rows.push(row);
        blockHeading = row;
        continue;
      }
      if (bankColumns.length && bankColumns.every(index => isEmpty(row.c[index]) && !row.notes?.[index])) continue;
      const cells = result.columns.flatMap(index => [row.c[index], row.notes?.[index]]).join(' ');
      const heading = blockHeading
        ? result.columns.flatMap(index => [blockHeading.c[index], blockHeading.notes?.[index]]).join(' ')
        : '';
      if (!matches(`${sectionText} ${headers} ${heading} ${cells}`)) continue;
      if (blockHeading && !result.rows.includes(blockHeading)) result.rows.push(blockHeading);
      result.rows.push(row);
      result.count++;
    }
    return result;
  }

  function value(text) {
    const label = normal(text).trim();
    if (['да', 'бесплатный', 'субсидия'].includes(label)) return `<span class="pill">${richText(text)}</span>`;
    if (['нет', '-', '—'].includes(label)) return `<span class="pill n">${richText(text)}</span>`;
    if (['стоп', 'стоп!'].includes(label)) return `<span class="pill s">${richText(text)}</span>`;
    return richText(text);
  }

  function cellNote(text, label = '', summary = 'Примечание') {
    if (!text) return '';
    const open = terms.length && matches(text) ? ' open' : '';
    const accessibleLabel = label ? ` aria-label="Примечание · ${esc(label)}"` : '';
    return `<details class="memo-cell-note"${open}><summary${accessibleLabel}>${summary}</summary><div>${richText(text)}</div></details>`;
  }

  function bankLabel(label, bankId = BankLogos.identify(label)) {
    return BankLogos.icon(bankId) + richText(label);
  }

  function fields(entries, bankLabels = false) {
    return `<dl>${entries.map(([label, text, note]) =>
      `<div><dt>${bankLabels ? bankLabel(label) : richText(label)}</dt><dd>${value(text)}${cellNote(note, label)}</dd></div>`).join('')}</dl>`;
  }

  function card(item) {
    if (item.t === 'note') return `<div class="note${item.h ? ' h' : ''}">${richText(item.x)}${cellNote(item.note)}</div>`;
    const limit = !terms.length && item.kv.length > 7 ? 4 : item.kv.length;
    const extras = item.kv.slice(limit);
    const extraFields = extras.length ? fields(extras, Boolean(item.kb)) : '';
    const more = item.more.map(entries => `<div class="memo-more">${fields(entries)}</div>`).join('');
    const title = item.b.length > 1 && !item.kb
      ? item.n.split(/([,\n])(?![^()]*\))/).map(part => bankLabel(part)).join('')
      : bankLabel(item.n, item.kb ? undefined : item.b[0]);
    return `<article class="card"><h3>${title}${item.g ? `<small>${esc(item.g)}</small>` : ''}</h3>
      ${cellNote(item.note, item.n)}
      ${fields(item.kv.slice(0, limit), Boolean(item.kb))}
      ${extraFields ? `<details class="memo-card-details"><summary>Все условия</summary>${extraFields}${more}</details>` : more}
      </article>`;
  }

  function subsidyBankName(section, index) {
    return section.head[index].replace(/^КВ · /, '');
  }

  function loyaltyProgram(program) {
    const title = richText(program.name);
    const bank = bankLabel(program.bank, 'sber');
    const head = program.head.map(([label, note]) =>
      `<th scope="col">${richText(label)}${cellNote(note, label)}</th>`).join('');
    const rows = program.rows.map(row =>
      `<tr>${row.map(text => `<td>${richText(text)}</td>`).join('')}</tr>`).join('');
    const compact = program.rows.map(([primary, ...rest]) =>
      `<article class="card"><h3>${richText(program.head[0][0])} ${richText(primary)}</h3>
        ${fields(rest.map((value, index) => [program.head[index + 1][0], value]))}</article>`).join('');
    const notes = program.head.map(([label, note]) => cellNote(note, label)).join('');
    const body = `<dl class="loyalty-context"><div><dt>Банк</dt><dd>${bank}</dd></div>
      <div><dt>ПВ</dt><dd>${richText(program.downPayment)}</dd></div>
      <div><dt>Срок программы</dt><dd>${richText(program.term)}</dd></div></dl>
      <div class="tw loyalty-table" tabindex="0" role="region" aria-label="${esc(program.name)}">
        <table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="loyalty-rows">${notes ? `<div class="note">${notes}</div>` : ''}${compact}</div>`;
    if (program.hidden) {
      return `<details class="loyalty-program"${terms.length ? ' open' : ''}>
        <summary>${title}<small>Скрытые строки источника</small></summary>${body}</details>`;
    }
    return `<section class="loyalty-program"><h3>${title}</h3>${body}</section>`;
  }

  function loyalty(result) {
    const info = result.info.map(item => item.immediate
      ? `<p class="note"><strong>${richText(item.title)}</strong> ${richText(item.text)}</p>`
      : `<details class="loyalty-info"${terms.length ? ' open' : ''}><summary>${richText(item.title)}</summary>
          <div>${richText(item.text)}</div></details>`).join('');
    return info + result.programs.map(loyaltyProgram).join('');
  }

  function subsidyCards(section, result) {
    const bankColumns = result.columns.filter(index => index >= section.lab);
    const rows = result.rows.map(row => {
      if (row.span) return `<div class="note h">${richText(row.c[0])}${cellNote(row.notes?.[0])}</div>`;

      const conditions = row.c.slice(0, section.lab);
      const hasConditions = conditions.some(Boolean);
      const conditionsHtml = hasConditions ? `<dl class="subsidy-terms">${conditions.map((text, index) =>
        `<div><dt>${esc(section.head[index])}</dt><dd>${richText((text || '—').replaceAll('\n', ' '))}${cellNote(row.notes?.[index], section.head[index])}</dd></div>`
      ).join('')}</dl>` : '';
      const banks = bankColumns.filter(index => !isEmpty(row.c[index]) || row.notes?.[index]).map(index => {
        const name = subsidyBankName(section, index);
        const text = isEmpty(row.c[index]) ? '—' : row.c[index];
        return `<div><dt>${bankLabel(name, section.bc[index]?.[0])}</dt><dd>${richText(text)}${cellNote(row.notes?.[index], name)}</dd></div>`;
      }).join('');
      if (!hasConditions) {
        return `<details class="subsidy-option"${terms.length ? ' open' : ''}>
          <summary>Максимальный срок по банкам</summary><dl class="subsidy-banks">${banks}</dl></details>`;
      }
      return `<article class="subsidy-option">${conditionsHtml}${banks
        ? `<h3>КВ по банкам</h3><dl class="subsidy-banks">${banks}</dl>`
        : '<p>КВ не указано</p>'}</article>`;
    }).join('');
    return `<div class="subsidy-cards">${rows}</div>`;
  }

  function table(section, result) {
    const compact = familySubsidy(section);
    const columns = result.columns;
    const head = section.head.length
      ? `<thead><tr>${columns.map(index => {
        const label = compact ? subsidyBankName(section, index) : section.head[index];
        return `<th scope="col">${bankLabel(label, section.bc?.[index]?.[0])}${cellNote(section.headerNotes?.[index], label)}</th>`;
      }).join('')}</tr></thead>`
      : '';
    const rows = result.rows.map(row => {
      if (row.span) {
        return `<tr><td class="span" colspan="${columns.length}">${richText(row.c[0])}${cellNote(row.notes?.[0])}</td></tr>`;
      }
      return `<tr${row.sub ? ' class="sub"' : ''}>${columns.map(index => {
        const cell = row.c[index];
        const content = normal(section.head[index]) === 'банк' ? bankLabel(cell) : richText(cell);
        return `<td${cell && isEmpty(cell) ? ' class="x"' : ''}>${content}${cellNote(row.notes?.[index], section.head[index], compact ? 'Прим.' : 'Примечание')}</td>`;
      }).join('')}</tr>`;
    }).join('');
    return `${compact ? '' : '<p class="memo-table-hint">Прокрутите таблицу, чтобы увидеть остальные столбцы.</p>'}
      <div class="tw${compact ? ' subsidy-table' : ''}" tabindex="0" role="region" aria-label="${esc(section.t)}"><table>${head}<tbody>${rows}</tbody></table></div>
      ${compact ? subsidyCards(section, result) : ''}`;
  }

  function entry(section, subtitle) {
    return `<a class="memo-entry" href="#${esc(section.id)}"><b>${bankLabel(section.t)}</b><small>${esc(subtitle)}</small></a>`;
  }

  function catalog() {
    return `<div class="memo-catalog">${groups.map(([title, description], index) => {
      const sections = secs.filter(section => section.g === index);
      const cards = sections.map(section =>
        entry(section, section.id === 's2' ? 'ПВ, сроки и условия банков' : section.d));
      return sections.length ? `<section><h2>${esc(title)}</h2><p>${esc(description)}</p>
        <div class="memo-grid">${cards.join('')}</div></section>` : '';
    }).join('')}</div>`;
  }

  const plural = new Intl.PluralRules('ru');
  const labels = { one: 'совпадение', few: 'совпадения', many: 'совпадений' };
  const countLabel = count => `${count} ${labels[plural.select(count)]}`;

  function searchResults() {
    const found = secs.map(section => [section, filterSection(section, true)]).filter(([, result]) => result.count);
    const total = found.reduce((sum, [, result]) => sum + result.count, 0);
    $('#status').textContent = total ? `Найдено: ${countLabel(total)}` : 'Совпадений нет';
    return total
      ? `<section class="memo-results"><h2>Разделы с совпадениями</h2><div class="memo-grid">${found.map(([section, result]) => entry(section, countLabel(result.count))).join('')}</div></section>`
      : '<p class="empty">Попробуйте другое слово или измените фильтр по банкам.</p>';
  }

  function detail(section, active) {
    const result = filterSection(section, false);
    if (active) {
      $('#status').textContent = (result.count ? `В разделе: ${countLabel(result.count)}` : 'В разделе нет совпадений') +
        (result.filterUnavailable ? '. Для этого раздела фильтр по банкам недоступен.' : '');
    }
    const nav = groups.map(([title], index) => {
      const sections = secs.filter(item => item.g === index);
      return sections.length ? `<optgroup label="${esc(title)}">${sections.map(option).join('')}</optgroup>` : '';
    }).join('');
    function option(item) {
      return `<option value="${esc(item.id)}"${item.id === section.id ? ' selected' : ''}>${esc(item.t)}</option>`;
    }
    let contents = '';
    if (section.kind === 'loyalty' && result.programs) contents = loyalty(result);
    else if (section.kind === 'cards' && result.items.length) contents = `<div class="cards">${result.items.map(card).join('')}</div>`;
    else if (result.rows.length) contents = table(section, result);
    return `<section class="memo-section">
      <nav class="memo-section-nav" aria-label="Разделы памятки">
        <a class="memo-source" href="#">${active ? 'К результатам поиска' : 'Все разделы памятки'}</a>
        <label for="memo-sections">Раздел
          <select id="memo-sections">${nav}${section.g >= groups.length ? option(section) : ''}</select>
        </label>
      </nav>
      <h2 class="sh" tabindex="-1">${bankLabel(section.t)}</h2><p class="sub">${esc(section.d)}</p>
      ${(section.notes ?? []).map(([label, text]) => `<div class="note">${richText(label)}${cellNote(text, label)}</div>`).join('')}
      ${contents || '<p class="empty">Попробуйте изменить поиск или фильтр по банкам.</p>'}
      </section>`;
  }

  function render() {
    terms = searchable(state.query).trim().split(/\s+/).filter(Boolean);
    const phrases = terms.map(term => term === 'маткапитал' ? capitalAlias.source : safeRegex(term).replace(/е/g, '[её]'));
    highlight = phrases.length ? new RegExp(`(${phrases.join('|')})`, 'giu') : null;
    const section = secs.find(item => item.id === location.hash.slice(1));
    const active = Boolean(terms.length || state.banks.size);
    const filterButtons = $('#selected');
    const focusedRemoval = filterButtons.contains(document.activeElement);
    sourceUrl.searchParams.set('gid', sheetIds[section?.id] ?? '1749938485');
    source.href = sourceUrl.href;
    source.textContent = section ? 'Открыть вкладку в Google Таблице' : 'Открыть Google Таблицу';
    $('#status').textContent = '';
    app.innerHTML = section ? detail(section, active) : active ? searchResults() : catalog();
    $('#cl').style.display = state.query ? 'block' : 'none';
    $('#bn').textContent = state.banks.size;
    $('#bn').hidden = !state.banks.size;
    bankFilter.classList.toggle('on', Boolean(state.banks.size));
    $('#filters').hidden = !active;
    const selected = banks.filter(bank => state.banks.has(bank.id));
    filterButtons.innerHTML = selected.map(bank => `<button class="chip on" type="button" data-remove="${esc(bank.id)}"
      aria-label="Убрать банк ${esc(bank.n)}">${BankLogos.icon(bank.id)}${esc(bank.n)} ×</button>`).join('');
    if (focusedRemoval) (filterButtons.querySelector('button') || bankFilter).focus();
    $('#chips').querySelectorAll('button').forEach(button => {
      const pressed = state.banks.has(button.dataset.bank);
      button.setAttribute('aria-pressed', String(pressed));
      button.classList.toggle('on', pressed);
    });
  }

  function setBankPanel(open) {
    $('#bp').hidden = !open;
    bankFilter.setAttribute('aria-expanded', String(open));
  }

  $('#chips').innerHTML = banks.map(bank =>
    `<button class="chip" type="button" data-bank="${esc(bank.id)}" aria-pressed="false">${BankLogos.icon(bank.id)}${esc(bank.n)}</button>`).join('');
  bankFilter.addEventListener('click', () => setBankPanel($('#bp').hidden));
  $('#chips').addEventListener('click', event => {
    const button = event.target.closest('[data-bank]');
    if (!button) return;
    const bank = button.dataset.bank;
    if (state.banks.has(bank)) state.banks.delete(bank);
    else state.banks.add(bank);
    render();
  });
  $('#selected').addEventListener('click', event => {
    const button = event.target.closest('[data-remove]');
    if (!button) return;
    state.banks.delete(button.dataset.remove);
    render();
  });
  let timer;
  query.addEventListener('input', () => {
    clearTimeout(timer);
    state.query = query.value;
    timer = setTimeout(render, 140);
  });
  function clearQuery() {
    clearTimeout(timer);
    state.query = query.value = '';
    render();
    query.focus();
  }
  $('#cl').addEventListener('click', clearQuery);
  $('#rs').addEventListener('click', () => {
    state.banks.clear();
    clearQuery();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !$('#bp').hidden) {
      setBankPanel(false);
      bankFilter.focus();
    }
  });
  app.addEventListener('change', event => {
    if (event.target.id === 'memo-sections') location.hash = event.target.value;
  });
  addEventListener('hashchange', () => {
    setBankPanel(false);
    render();
    const heading = $('.memo-section h2');
    const target = heading || query;
    target.focus({ preventScroll: true });
    if (window.frameElement) {
      const scrollTop = window.parent.scrollY;
      const frameTop = window.frameElement.getBoundingClientRect().top + scrollTop;
      const offset = window.parent.document.querySelector('header')?.offsetHeight ?? 0;
      if (scrollTop > frameTop - offset) window.parent.scrollTo(0, frameTop - offset);
    } else {
      window.scrollTo(0, 0);
    }
  });
  render();
}
</script>
</body></html>
