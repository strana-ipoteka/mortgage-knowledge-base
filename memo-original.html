<style>
:root{--bg:#f3f4f8;--sf:#fff;--tx:#29303e;--mu:#6b7285;--bb:#951b81;--bl:#f5e9f3;--bm:#e0c6db;--fu:#c7017f;--fl:#fde6f2;--ln:#e3e5ed;--thb:#951b81;--gr:linear-gradient(120deg,#831f82,#c7017f 60%,#e30613);--sh:0 2px 10px rgba(41,48,62,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c212b;--sf:#272d3a;--tx:#eceef4;--mu:#a3a9bb;--bb:#e08fd2;--bl:#3a2c3b;--bm:#5a4358;--fu:#f06bb4;--fl:#47263c;--ln:#363d4d;--thb:#7a1a6c;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c212b;--sf:#272d3a;--tx:#eceef4;--mu:#a3a9bb;--bb:#e08fd2;--bl:#3a2c3b;--bm:#5a4358;--fu:#f06bb4;--fl:#47263c;--ln:#363d4d;--thb:#7a1a6c;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--fu)}mark{background:var(--fl);color:var(--fu);border-radius:3px;padding:0 2px;font-weight:600}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{display:flex;gap:8px;align-items:center;max-width:1200px;margin:auto;padding:10px 14px}
.logo{font-weight:700;color:var(--tx);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:10px;font-size:14px}.brand{max-width:1200px;margin:auto;padding:16px 14px 6px}.brand img{height:30px;width:auto;display:block}.logo i{color:var(--fu);font-style:normal}
.sr{flex:1;position:relative}.sr input{width:100%;padding:10px 36px 10px 14px;border:1.5px solid var(--bm);border-radius:14px;background:var(--sf);color:var(--tx);font-family:inherit;font-size:inherit;outline:0}
.sr input:focus{border-color:var(--fu)}.sr button{position:absolute;right:6px;bottom:6px;border:0;background:var(--bl);color:var(--bb);width:26px;height:26px;border-radius:50%;cursor:pointer;display:none}
.btn{border:1.5px solid var(--bm);background:var(--sf);color:var(--bb);border-radius:14px;padding:9px 12px;font-family:inherit;font-size:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn b{background:var(--fu);color:#fff;border-radius:10px;padding:0 7px;margin-left:4px;font-size:12px}.btn.on{background:var(--bl)}
.panel{max-width:1200px;margin:auto;padding:0 14px 12px}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bm);background:var(--sf);color:var(--tx);border-radius:20px;padding:4px 11px;font-family:inherit;font-size:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--bb);color:#fff;border-color:var(--bb)}.lnk{background:none;border:0;color:var(--fu);font-family:inherit;font-size:inherit;cursor:pointer;padding:8px 0 0;font-weight:600}
main{max-width:1200px;margin:auto;padding:16px 14px 60px}
.hero{background:var(--gr);color:#fff;border-radius:22px;padding:22px;margin-bottom:18px}
.hero h1{margin:0 0 6px;font-size:24px;color:#fff}.hero p{margin:0;color:rgba(255,255,255,.9)}.st{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.st span{background:rgba(255,255,255,.95);color:#29303e;border-radius:12px;padding:6px 12px;font-size:13px;color:var(--mu)}.st b{color:var(--fu);font-size:16px}
.grp{margin:22px 0 10px}.grp h2{margin:0;font-size:17px;color:var(--bb)}.grp p{margin:0;color:var(--mu);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{display:block;text-decoration:none;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--bb);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.g1 .tile,.g3 .tile{border-left-color:var(--fu)}.tile:hover{border-color:var(--fu)}.tile b{display:block}.tile small{color:var(--mu);display:block}.tile em{font-style:normal;color:var(--fu);font-size:12px;font-weight:600}
.back{display:inline-block;margin-bottom:10px;color:var(--bb);font-weight:600;text-decoration:none}
h2.sh{margin:6px 0 2px;color:var(--bb);font-size:21px}.sub{color:var(--mu);margin:0 0 10px}
.info{background:var(--bl);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:16px;color:var(--bb);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card h3 small{background:var(--fl);color:var(--fu);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600}
dl{margin:0;display:grid;gap:7px}dl div{border-top:1px dashed var(--ln);padding-top:6px}dt{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.02em}dd{margin:0;overflow-wrap:anywhere}
dl.more{margin-top:10px;border-top:2px solid var(--bm);padding-top:8px}
.pill{border-radius:10px;padding:1px 10px;font-weight:600;font-size:13px;background:var(--bl);color:var(--bb)}.pill.n{background:var(--ln);color:var(--mu)}.pill.s{background:var(--fu);color:#fff}
.note{background:var(--sf);border:1px solid var(--bm);border-left:4px solid var(--fu);border-radius:12px;padding:10px 14px;margin:0 0 12px;grid-column:1/-1}.note.h{font-weight:700;color:var(--bb);background:var(--bl);border-color:var(--bl)}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;max-height:75vh}
table{border-collapse:separate;border-spacing:0;font-size:14px;line-height:1.45;width:max-content;min-width:100%}tbody tr:nth-child(even) td{background:var(--bg)}tbody tr:hover td{background:var(--bl)}td.c{text-align:center}
th,td{border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);padding:10px 12px;vertical-align:top;min-width:96px;max-width:320px}th{font-size:12.5px;line-height:1.3}
th{position:sticky;top:0;background:var(--thb);color:#fff;z-index:2;text-align:left}td:first-child,th:first-child{position:sticky;left:0;background:var(--sf);z-index:1;font-weight:600;min-width:120px;max-width:200px;box-shadow:2px 0 4px rgba(41,48,62,.06)}tbody tr:nth-child(even) td:first-child{background:var(--bg)}th:first-child{background:var(--thb);color:#fff;z-index:3}
tr.sub td{background:var(--fl);color:var(--fu);font-weight:700}td.x{color:var(--bm);text-align:center}td.span{max-width:none;white-space:normal;background:var(--bg)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
footer{color:var(--mu);font-size:12px;margin-top:22px}
@media (max-width:600px){.hero h1{font-size:20px}.logo span{display:none}}

.memo-return{position:sticky;top:0;z-index:12;padding:9px max(14px,calc((100vw - 1200px)/2 + 14px));background:var(--bg);border-bottom:1px solid var(--ln)}.memo-return a{display:inline-block;background:var(--sf);color:var(--bb);border:1px solid var(--bm);border-radius:12px;padding:8px 14px;text-decoration:none;font-weight:700;font-size:14px}.memo-return a:hover{border-color:var(--fu);color:var(--fu)}

#theme{margin-left:auto;min-width:86px}

/* Общий стиль страниц базы знаний, без изменений логики и сетки банков */
:root[data-theme="light"]{--bg:#f8f6f8;--sf:#fff;--tx:#261e2c;--mu:#766b79;--ln:#e9e3ea;--bb:#9b287f}
:root[data-theme="dark"]{--bg:#1b2029;--sf:#262b36;--tx:#f0edf3;--mu:#b7aab8;--ln:#42404e;--bb:#e389c6}
body{font-family:Inter,Montserrat,"Segoe UI",Arial,sans-serif}
.memo-return{position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:70px;background:var(--sf);border-bottom:1px solid var(--ln);padding:14px max(24px,calc((100vw - 1160px)/2 + 24px))}
.memo-return a{background:none;border:0;color:var(--bb);border-radius:0;padding:0;font-size:13px}
.memo-headtools{display:flex;align-items:center;gap:12px}
.memo-wordmark{font-weight:850;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--bb)}
.memo-theme{font-family:inherit;font-size:13px;font-weight:700;border-radius:11px;border:1px solid #e5d0df;color:#9b287f;background:#f6edf4;padding:10px 14px;cursor:pointer;white-space:nowrap}
.memo-theme:hover{border-color:#c88fbb;background:#f9edf6}
:root[data-theme="dark"] .memo-theme{background:#35283a;border-color:#5b3e57;color:#efb1dd}
.brand{max-width:1160px}
.brand img{height:24px}
.top{background:var(--bg);border-color:var(--ln)}
.bar,.panel,main{max-width:1160px}
.btn{border-radius:12px}
.sr input{background:var(--sf);border-color:var(--ln);color:var(--tx);border-radius:12px}
.hero{border-radius:24px}
.tile{border-radius:18px;border-color:var(--ln);background:var(--sf);box-shadow:0 7px 28px #31123508}
.tile:hover{box-shadow:0 15px 40px #31123512}
.chip{border-radius:14px}
@media(max-width:670px){.memo-return{padding:14px;min-height:62px}.memo-wordmark{font-size:10px}.memo-headtools{gap:7px}.memo-theme{padding:9px;font-size:12px}}
</style>

<style>

.loyalty-program h3, .loyalty-program > summary, .loyalty-info > summary { margin: 0; font-size: 16px; font-weight: 700 }

.loyalty-info > div, .loyalty-program .loyalty-context { margin: 10px 0 0; overflow-wrap: anywhere }

}
.family-subsidy > summary { line-height: 1.5; overflow-wrap: anywhere }
.family-subsidy > summary small { margin-inline-start: 8px }
.family-rate { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--ln); border-radius: 9px; background: var(--bg) }
.family-rate > summary { min-height: 28px; cursor: pointer; font-weight: 700 }
.family-term { margin-top: 10px }

<script>
const $ = selector => document.querySelector(selector);
const app = $('#app');
const query = $('#q');
const bankFilter = $('#bb');
const data = window.MEMO_DATA;

if (!data) {
  $('.memo-tools').hidden = true;
  $('#status').textContent = 'Памятка не загрузилась. Условия доступны в Google Таблице.';
} else {
  initMemo(data);
}

function initMemo({ secs, groups, banks }) {
  const state = { query: '', banks: new Set(), family: { region: '', children: '', query: '' } };
  const comparisons = new Map(['s0', 's1', 's2', 's4', 's5', 's6', 's8'].map(id =>
    [id, { view: 'list', banks: ['', '', ''], filterKey: null, group: '', condition: '', differences: false }]));
  const bankNames = new Map(banks.map(bank => [bank.id, bank.n]));
  const sheetIds = {
    s0: 0, s1: 1580280998, s2: 330286105, s3: 292621505, s4: 2143169685,
    s5: 1123676935, s6: 1297562849, s7: 860172231, s8: 558231179, s9: 2109045961,
    s10: 1163106320, s11: 808915854, s12: 31258751, s13: 832103270, s14: 2110526252,
    s15: 623330971, s16: 277931211, s17: 1899907639, s18: 153621334,
    s20: 1016212115
  };
  const source = $('#source');
  const sourceUrl = new URL(source.href);
  const normal = text => String(text ?? '').toLowerCase().replace(/ё/g, 'е');
  const capitalAlias = /мат[.\s]*(?:еринский\s+)?кап(?:итал)?|(?<![а-яё])мск(?![а-яё])/giu;
  const searchable = text => normal(text).replace(capitalAlias, 'маткапитал');
  const isEmpty = value => ['', 'х', 'x'].includes(normal(value).trim());
  const familySubsidy = section => section.id === 's10' || section.id === 's11';
  const esc = text => String(text ?? '').replace(/[&<>"]/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
  })[ch]);
  const safeRegex = text => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let terms = [];
  let highlight = null;

  function matches(text) {
    const value = searchable(text);
    return terms.every(term => value.includes(term));
  }

  function richText(text) {
    return String(text ?? '').split(/(https?:\/\/\S+)/g).map((part, index) => {
      if (index % 2) return `<a href="${esc(part)}" target="_blank" rel="noopener">Открыть ссылку</a>`;
      return (highlight
        ? part.split(highlight).map((fragment, j) => j % 2 ? `<mark>${esc(fragment)}</mark>` : esc(fragment)).join('')
        : esc(part)).replace(/\n/g, '<br>');
    }).join('');
  }

  function filterSection(section, inSearch) {
    const selected = state.banks;
    const byBank = selected.size > 0;
    const hasBankColumns = Boolean(section.bc);
    const hasBankTags = section.banks.length > 0;
    const filterUnavailable = byBank && !hasBankTags && !hasBankColumns;
    const result = { count: 0, items: [], rows: [], columns: [], filterUnavailable };
    if (byBank && hasBankTags && !hasBankColumns && !section.banks.some(bank => selected.has(bank))) return result;
    if (inSearch && filterUnavailable) return result;

    const sectionText = [section.t, section.d, ...(section.notes ?? []).flat()].join(' ');
    if (section.id === 's3') {
      const conditions = familyConditions(section, sectionText);
      if (conditions) return { ...result, ...conditions };
    }
    if (section.id === 's9') return standardSubsidy(section, sectionText);
    if (familySubsidy(section)) return groupedFamilySubsidy(section, sectionText);
    if (section.kind === 'loyalty') {
      result.info = section.info.filter(item => matches([sectionText, item.title, item.text].join(' ')));
      result.programs = section.programs.map(program => {
        const context = [sectionText, program.name, program.bank, program.downPayment, program.term, ...program.head.flat()].join(' ');
        return { ...program, rows: program.rows.filter(row => matches([context, ...row].join(' '))) };
      }).filter(program => program.rows.length);
      result.count = result.programs.reduce((count, program) => count + program.rows.length, 0)
        + (terms.length ? result.info.length : 0);
      return result;
    }
    if (section.kind === 'cards') {
      const shared = section.id === 's7' ? section.items.filter(item => item.t === 'note')
        .flatMap(item => [item.x, item.note]).join(' ') : '';
      result.items = section.items.flatMap(item => {
        if (item.t === 'note') {
          const show = terms.length ? matches([sectionText, item.x, item.note].join(' ')) : !inSearch;
          return !byBank && show ? [item] : [];
        }
        if (byBank && !item.b.some(bank => selected.has(bank))) return [];
        const entries = byBank && item.kb ? item.kv.filter((_, index) =>
          item.kb[index]?.some(bank => selected.has(bank))) : item.kv;
        const text = byBank && item.kb
          ? [item.n, item.g, ...entries.flat(), ...item.more.flat(2)].join(' ')
          : `${item.s} ${item.n} ${item.b.map(bank => bankNames.get(bank)).join(' ')}`;
        return matches([sectionText, text, item.note, shared].join(' ')) ? [{ ...item, kv: entries }] : [];
      });
      result.count = result.items.filter(item => terms.length || item.t !== 'note').length;
      return result;
    }

    const width = section.head.length || Math.max(0, ...section.rows.map(row => row.c.length));
    result.columns = Array.from({ length: width }, (_, index) => index);
    if (byBank && hasBankColumns) {
      result.columns = result.columns.filter(index =>
        index < section.lab || section.bc[index]?.some(bank => selected.has(bank)));
    }
    const bankColumns = byBank && hasBankColumns ? result.columns.filter(index => index >= section.lab) : [];
    if (byBank && hasBankColumns && !bankColumns.length) return result;
    const headers = result.columns.flatMap(index => [section.head[index], section.headerNotes?.[index]]).join(' ');
    let blockHeading;
    for (const row of section.rows) {
      if (row.span) {
        if (matches([sectionText, row.c[0], row.notes?.[0]].join(' '))) {
          result.rows.push(row);
          if (terms.length) result.count++;
        }
        continue;
      }
      if (row.sub) {
        if (!terms.length && !byBank) result.rows.push(row);
        blockHeading = row;
        continue;
      }
      if (bankColumns.length && bankColumns.every(index => isEmpty(row.c[index]) && !row.notes?.[index])) continue;
      const cells = result.columns.flatMap(index => [row.c[index], row.notes?.[index]]).join(' ');
      const heading = blockHeading
        ? result.columns.flatMap(index => [blockHeading.c[index], blockHeading.notes?.[index]]).join(' ')
        : '';
      if (!matches(`${sectionText} ${headers} ${heading} ${cells}`)) continue;
      if (blockHeading && !result.rows.includes(blockHeading)) result.rows.push(blockHeading);
      result.rows.push(row);
      result.count++;
    }
    return result;
  }

  function value(text) {
    const label = normal(text).trim();
    if (['да', 'бесплатный', 'субсидия'].includes(label)) return `<span class="pill">${richText(text)}</span>`;
    if (['нет', '-', '—'].includes(label)) return `<span class="pill n">${richText(text)}</span>`;
    if (['стоп', 'стоп!'].includes(label)) return `<span class="pill s">${richText(text)}</span>`;
    return richText(text);
  }

  function cellNote(text, label = '', summary = 'Примечание') {
    if (!text) return '';
    const open = terms.length && matches(text) ? ' open' : '';
    const accessibleLabel = label ? ` aria-label="Примечание · ${esc(label)}"` : '';
    return `<details class="memo-cell-note"${open}><summary${accessibleLabel}>${summary}</summary><div>${richText(text)}</div></details>`;
  }

  function bankLabel(label, bankId = BankLogos.identify(label)) {
    return BankLogos.icon(bankId) + richText(label);
  }

  function fields(entries, bankLabels = false, renderValue = value) {
    return `<dl>${entries.map(([label, text, note]) =>
      `<div><dt>${bankLabels ? bankLabel(label) : richText(label)}</dt><dd>${renderValue(text)}${cellNote(note, label)}</dd></div>`).join('')}</dl>`;
  }

  function card(item, { renderValue = value } = {}) {
    if (item.t === 'note') return `<div class="note${item.h ? ' h' : ''}">${richText(item.x)}${cellNote(item.note)}</div>`;
    const limit = !terms.length && item.kv.length > 7 ? 4 : item.kv.length;
    const extras = item.kv.slice(limit);
    const extraFields = extras.length ? fields(extras, Boolean(item.kb), renderValue) : '';
    const more = item.more.map(entries => `<div class="memo-more">${fields(entries, false, renderValue)}</div>`).join('');
    const title = item.b.length > 1 && !item.kb
      ? item.n.split(/([,\n])(?![^()]*\))/).map(part => bankLabel(part)).join('')
      : bankLabel(item.n, item.kb ? undefined : item.b[0]);
    return `<article class="card"><h3>${title}${item.g ? `<small>${esc(item.g)}</small>` : ''}</h3>
      ${cellNote(item.note, item.n)}
      ${fields(item.kv.slice(0, limit), Boolean(item.kb), renderValue)}
      ${extraFields ? `<details class="memo-card-details"><summary>Все условия</summary>${extraFields}${more}</details>` : more}
      </article>`;
  }

  function generalValue(text) {
    const trimmed = String(text ?? '').trimStart();
    const answer = /^(да|нет)(?=$|[\s/.,:;!?()—-])/iu.exec(trimmed);
    if (!answer) return value(text);
    const yes = normal(answer[0]) === 'да';
    return `<span class="answer-word answer-${yes ? 'yes' : 'no'}">${richText(yes ? 'Да' : 'Нет')}</span>${richText(trimmed.slice(answer[0].length))}`;
  }

  function generalComparison(section, general) {
    const cards = section.items.filter(item => item.t === 'card');
    const groups = [...new Set(cards.map(item => item.g).filter(Boolean))];
    if (groups.length && !groups.includes(general.group)) general.group = groups[0];
    const available = cards.filter(item => (!groups.length || item.g === general.group)
      && (!state.banks.size || item.b.some(id => state.banks.has(id))));
    const bankCounts = new Map();
    for (const { b } of available) bankCounts.set(b[0], (bankCounts.get(b[0]) ?? 0) + 1);
    const byId = new Map(available.map((item, index) => {
      const bank = item.b[0];
      return [bank && bankCounts.get(bank) === 1 ? bank : `card-${index}`, item];
    }));
    const filterKey = JSON.stringify([general.group, [...state.banks].sort()]);
    if (general.filterKey !== filterKey) {
      const defaults = [...byId.keys()].slice(0, state.banks.size ? 3 : 2);
      general.banks = Array.from({ length: 3 }, (_, index) => defaults[index] ?? '');
      general.filterKey = filterKey;
    }
    const selected = general.banks.map(id => byId.get(id)).filter(Boolean);
    const key = text => normal(text).replace(/\s+/g, ' ').trim();
    const labels = new Map();
    const bankFields = new Map(available.map(item => [item, new Map(item.kv.map(entry => {
      const id = key(entry[0]);
      if (!labels.has(id)) labels.set(id, entry[0]);
      return [id, entry];
    }))]));
    if (!labels.has(general.condition)) general.condition = '';
    const rows = [...labels].flatMap(([id, label]) => {
      if (general.condition && general.condition !== id) return [];
      const cells = selected.map(item => bankFields.get(item).get(id));
      const queryMatch = matches([section.t, section.d, label, ...selected.map(item => item.n), ...cells.flat()].join(' '));
      const differences = new Set(cells.map(entry => key(entry?.[1]) + '\n' + key(entry?.[2]))).size > 1;
      return queryMatch && (!general.differences || selected.length < 2 || differences) ? [{ label, cells }] : [];
    });
    const bankOptions = general.banks.map((id, index) => `<label for="compare-bank-${index}">Банк ${index + 1}
      <select id="compare-bank-${index}" data-compare-bank="${index}">
        <option value="">Выберите банк</option>${[...byId].map(([key, item]) =>
          `<option value="${esc(key)}"${id === key ? ' selected' : general.banks.includes(key) ? ' disabled' : ''}>${esc(item.n)}</option>`
        ).join('')}</select></label>`).join('');
    const conditionOptions = [...labels].map(([id, label]) =>
      `<option value="${esc(id)}"${general.condition === id ? ' selected' : ''}>${esc(label.replace(/\s+/g, ' '))}</option>`).join('');
    const groupPicker = groups.length > 1 ? `<div class="compare-object"><label for="compare-group">
      Тип объекта<select id="compare-group">${groups.map(group =>
        `<option value="${esc(group)}"${general.group === group ? ' selected' : ''}>${esc(group)}</option>`).join('')}
      </select></label></div>` : '';
    const cell = (entry, label) => {
      const [, text, note] = entry ?? [];
      return (text && !isEmpty(text) ? generalValue(text) : '<span class="compare-missing">Не указано</span>') + cellNote(note, label);
    };
    const head = selected.map(item => `<th scope="col">${bankLabel(item.n, item.b[0])}</th>`).join('');
    const tableRows = rows.map(({ label, cells }) => `<tr><th scope="row">${richText(label)}</th>
      ${cells.map(entry => `<td>${cell(entry, label)}</td>`).join('')}</tr>`).join('');
    const compact = rows.map(({ label, cells }) => `<article class="card"><h3>${richText(label)}</h3><dl>
      ${cells.map((entry, index) => `<div><dt>${bankLabel(selected[index].n, selected[index].b[0])}</dt><dd>${cell(entry, label)}</dd></div>`).join('')}
      </dl></article>`).join('');
    const comparison = selected.length && rows.length
      ? `<div class="tw loyalty-table compare-table" tabindex="0" role="region" aria-label="Сравнение общих условий банков">
          <table><thead><tr><th scope="col">Условие</th>${head}</tr></thead><tbody>${tableRows}</tbody></table></div>
        <div class="loyalty-rows compare-rows">${compact}</div>`
      : `<p class="empty">${!selected.length ? 'Выберите банки для сравнения.' : 'Нет условий, подходящих под выбранные фильтры.'}</p>`;
    return `<div class="general-compare">${groupPicker}<div class="compare-banks">${bankOptions}</div>
      <div class="compare-options"><label for="compare-condition">Условие<select id="compare-condition">
        <option value="">Все условия</option>${conditionOptions}</select></label>
        <label class="compare-differences"><input id="compare-differences" type="checkbox"
          ${general.differences ? 'checked' : ''} ${selected.length < 2 ? 'disabled' : ''}> Только различия</label></div>
      ${comparison}</div>`;
  }

  function generalConditions(section, result, general) {
    const tabs = [['list', 'По банкам'], ['compare', 'Сравнить банки']].map(([id, label]) =>
      `<button type="button" id="general-${id}" data-general-view="${id}" aria-pressed="${general.view === id}">${label}</button>`).join('');
    const content = general.view === 'compare' ? generalComparison(section, general) : result.items.length
      ? `<div class="cards">${result.items.map(item => card(item, { renderValue: generalValue })).join('')}</div>`
      : '<p class="empty">Попробуйте изменить поиск или фильтр по банкам.</p>';
    return `<div class="general-views" role="group" aria-label="Вид общих условий">${tabs}</div>${content}`;
  }

  function trancheView(section, result) {
    const notes = section.items.filter(item => item.t === 'note');
    const firstTranche = notes.find(item => /^первый транш\s*\(/i.test(item.x));
    const firstMatch = firstTranche?.x.match(/^первый транш\s*\(\s*минимальный\s+с\s+([^()]+)\)\s+(.+)$/i);
    const otherNotes = notes.filter(item => !firstMatch || item !== firstTranche).map(card).join('');
    const banks = result.items.filter(item => item.t === 'card').map(item => {
      const entry = label => item.kv.find(field => field[0] === label) ?? [];
      const [, program, programNote] = entry('Программа');
      const [, loan, loanNote] = entry('Сумма');
      const [, calculator, calculatorNote] = entry('Калькулятор');
      const [, comment, commentNote] = entry('Комментарий');
      const [, payment, paymentNote] = entry('Досрочное гашение');
      const known = new Set(['Программа', 'Сумма', 'ПВ', 'Ставка', 'Калькулятор', 'Комментарий', 'Досрочное гашение']);
      const rateRows = [item.kv, ...item.more].flatMap(block => {
        const [, down, downNote] = block.find(field => field[0] === 'ПВ') ?? [];
        const [, rate, rateNote] = block.find(field => field[0] === 'Ставка') ?? [];
        return down || rate ? [`<div><dt>ПВ ${richText(down)}</dt><dd>${richText(rate || '—')}
          ${cellNote(downNote, 'ПВ')}${cellNote(rateNote, 'Ставка')}</dd></div>`] : [];
      }).join('');
      const discounts = (comment ?? '').split(/\n\s*\n/).filter(Boolean).map(block =>
        `<ul>${block.split('\n').filter(line => line.trim()).map(line => `<li>${richText(line.trim())}</li>`).join('')}</ul>`).join('');
      const metrics = [
        firstMatch ? `<div><dt>Минимальный первый транш</dt><dd>${richText(firstMatch[2].replace(/\s*р\.?$/i, ' ₽'))}</dd>
          <small>с ${richText(firstMatch[1].replace(/\s*г\.?$/i, ''))}</small>${cellNote(firstTranche.note, 'Первый транш')}</div>` : '',
        loan ? `<div><dt>Сумма кредита</dt><dd>${richText(loan.replace(/млн\.руб\.?$/i, 'млн ₽'))}
          ${cellNote(loanNote, 'Сумма кредита')}</dd></div>` : '',
      ].join('');
      const extra = [...item.kv.filter(field => !known.has(field[0])),
        ...item.more.flat().filter(([label]) => label !== 'ПВ' && label !== 'Ставка')];
      const link = /^https?:\/\/\S+$/i.test(calculator ?? '')
        ? `<a class="tranche-calculator" href="${esc(calculator)}" target="_blank" rel="noopener noreferrer">Открыть калькулятор</a>`
        : richText(calculator);
      return `<article class="tranche-card"><div class="tranche-header">
        <div><h3>${bankLabel(item.n, item.b[0])}</h3>${program ? `<p>${richText(program.replace(/-/g, ' · '))}</p>` : ''}
          ${cellNote(programNote, 'Программа')}${cellNote(item.note, item.n)}</div>
        <div>${link}${cellNote(calculatorNote, 'Калькулятор')}</div></div>
        <div class="tranche-body">
          ${metrics ? `<dl class="tranche-metrics">${metrics}</dl>` : ''}
          ${rateRows ? `<section><h4>Ставки по первоначальному взносу</h4><dl class="tranche-rates">${rateRows}</dl></section>` : ''}
          ${extra.length ? fields(extra) : ''}
          <div class="tranche-details">
            ${discounts ? `<details${terms.length ? ' open' : ''}><summary>Дисконты и ограничения</summary><div>
              ${discounts}${cellNote(commentNote, 'Комментарий')}</div></details>` : ''}
            ${payment ? `<details${terms.length ? ' open' : ''}><summary>Досрочное погашение</summary>
              <div>${richText(payment)}${cellNote(paymentNote, 'Досрочное погашение')}</div></details>` : ''}
          </div>
        </div></article>`;
    }).join('');
    return banks ? banks + otherNotes : result.items.map(card).join('');
  }

  function subsidyBankName(section, index) {
    return section.head[index].replace(/^КВ · /, '');
  }

  function rateNumber(rate) {
    const percent = /^\s*(\d+(?:[.,]\d+)?)\s*%+\s*$/.exec(rate)?.[1];
    return percent === undefined ? Infinity : Number(percent.replace(',', '.'));
  }

  function standardSubsidy(section, sectionText) {
    const bankColumns = new Map();
    section.bc.forEach((ids, index) => {
      if (index < section.lab) return;
      const fee = /^КВ\s*·/i.test(section.head[index]);
      for (const id of ids) {
        if (state.banks.size && !state.banks.has(id)) continue;
        if (!bankColumns.has(id)) {
          bankColumns.set(id, { id, name: bankNames.get(id) ?? subsidyBankName(section, index), down: [], fee: [] });
        }
        bankColumns.get(id)[fee ? 'fee' : 'down'].push(index);
      }
    });

    const rates = new Map();
    for (const row of section.rows) {
      if (row.span || row.sub) continue;
      const [rate, term] = row.c;
      const offers = [...bankColumns.values()].filter(bank => {
        const columns = [...bank.down, ...bank.fee];
        return columns.some(index => !isEmpty(row.c[index]) || row.notes?.[index])
          && matches([sectionText, rate, term, bank.name, 'Ставка Срок ПВ КВ',
            row.notes?.[0], row.notes?.[1],
            ...columns.flatMap(index => [section.head[index], section.headerNotes?.[index],
              row.c[index], row.notes?.[index]])].join(' '));
      }).map(bank => ({ bank, row }));
      if (!offers.length) continue;

      const number = rateNumber(rate);
      const key = Number.isFinite(number) ? number : rate;
      if (!rates.has(key)) rates.set(key, { rate, number, terms: new Map() });
      const rateGroup = rates.get(key);
      if (!rateGroup.terms.has(term)) rateGroup.terms.set(term, []);
      rateGroup.terms.get(term).push(...offers);
    }
    const subsidyGroups = [...rates.values()].sort((a, b) =>
      a.number === b.number ? 0 : a.number - b.number);
    const rows = section.rows.filter(row => row.span
      && bankColumns.size && matches([sectionText, row.c[0], row.notes?.[0]].join(' ')));
    const count = subsidyGroups.reduce((total, rate) =>
      total + [...rate.terms.values()].reduce((sum, offers) => sum + offers.length, 0), 0)
      + (terms.length ? rows.length : 0);
    return { subsidyGroups, rows, count };
  }

  function standardSubsidyView(section, result) {
    const notices = result.rows.map(row =>
      `<div class="note h">${richText(row.c[0])}${cellNote(row.notes?.[0])}</div>`).join('');
    const rates = result.subsidyGroups.map(({ rate, terms: durations }, index) => {
      const termBlocks = [...durations].map(([term, offers]) => {
        const cell = (row, columns, label) => columns.map(column => {
          const sourceNote = cellNote(section.headerNotes?.[column], `${label} · общие условия банка`);
          const note = cellNote(row.notes?.[column], label);
          const text = row.c[column];
          return text?.trim() || sourceNote || note
            ? `<div>${richText(text || '—')}${note}${sourceNote}</div>` : '';
        }).join('') || '—';
        const commonNotes = [0, 1].map(column => [...new Set(offers.map(({ row }) => row.notes?.[column]))]
          .map(note => cellNote(note, section.head[column])).join('')).join('');
        const rows = offers.map(({ bank, row }) => [
          bankLabel(bank.name, bank.id),
          cell(row, bank.down, 'ПВ и условия'),
          cell(row, bank.fee, 'КВ'),
        ]);
        const tableRows = rows.map(row => `<tr>${row.map(text => `<td>${text}</td>`).join('')}</tr>`).join('');
        const mobileRows = rows.map(([bank, down, fee]) => `<article class="card standard-row">
          <h4>${bank}</h4><dl><div><dt>ПВ и условия</dt><dd>${down}</dd></div>
          <div><dt>КВ</dt><dd>${fee}</dd></div></dl></article>`).join('');
        return `<section class="standard-term"><h3>Срок · ${richText(term || '—')}</h3>${commonNotes}
          <div class="tw loyalty-table" tabindex="0" role="region" aria-label="${esc([rate, term].join(' · '))}">
            <table><thead><tr><th scope="col">Банк</th><th scope="col">ПВ и условия</th><th scope="col">КВ</th></tr></thead>
            <tbody>${tableRows}</tbody></table></div>
          <div class="loyalty-rows">${mobileRows}</div></section>`;
      }).join('');
      const firstTerm = durations.keys().next().value;
      const termLabel = durations.size === 1 && firstTerm ? `<small>${richText(firstTerm)}</small>` : '';
      return `<details class="loyalty-program standard-rate"${index === 0 || terms.length ? ' open' : ''}>
        <summary>${richText(rate || 'Ставка не указана')}${termLabel}</summary>${termBlocks}</details>`;
    }).join('');
    return notices + rates;
  }

  function loyaltyProgram(program) {
    const title = richText(program.name);
    const bank = bankLabel(program.bank, 'sber');
    const head = program.head.map(([label, note]) =>
      `<th scope="col">${richText(label)}${cellNote(note, label)}</th>`).join('');
    const rows = program.rows.map(row =>
      `<tr>${row.map(text => `<td>${richText(text)}</td>`).join('')}</tr>`).join('');
    const compact = program.rows.map(([primary, ...rest]) =>
      `<article class="card"><h3>${richText(program.head[0][0])} ${richText(primary)}</h3>
        ${fields(rest.map((value, index) => [program.head[index + 1][0], value]))}</article>`).join('');
    const notes = program.head.map(([label, note]) => cellNote(note, label)).join('');
    const body = `<dl class="loyalty-context"><div><dt>Банк</dt><dd>${bank}</dd></div>
      <div><dt>ПВ</dt><dd>${richText(program.downPayment)}</dd></div>
      <div><dt>Срок программы</dt><dd>${richText(program.term)}</dd></div></dl>
      <div class="tw loyalty-table" tabindex="0" role="region" aria-label="${esc(program.name)}">
        <table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="loyalty-rows">${notes ? `<div class="note">${notes}</div>` : ''}${compact}</div>`;
    if (program.hidden) {
      return `<details class="loyalty-program"${terms.length ? ' open' : ''}>
        <summary>${title}<small>Скрытые строки источника</small></summary>${body}</details>`;
    }
    return `<section class="loyalty-program"><h3>${title}</h3>${body}</section>`;
  }

  function loyalty(result) {
    const info = result.info.map(item => item.immediate
      ? `<p class="note"><strong>${richText(item.title)}</strong> ${richText(item.text)}</p>`
      : `<details class="loyalty-info"${terms.length ? ' open' : ''}><summary>${richText(item.title)}</summary>
          <div>${richText(item.text)}</div></details>`).join('');
    return info + result.programs.map(loyaltyProgram).join('');
  }

  function groupedFamilySubsidy(section, sectionText) {
    const bankColumns = section.head.flatMap((label, column) => {
      if (!/^КВ\s*·/i.test(label)) return [];
      return (section.bc[column] ?? []).filter(id => !state.banks.size || state.banks.has(id))
        .map(id => ({ id, column, name: bankNames.get(id) ?? subsidyBankName(section, column) }));
    });
    const children = new Map();
    const limits = [];
    let count = 0;
    for (const row of section.rows) {
      if (row.span || row.sub) continue;
      const [condition, rate, term] = row.c;
      for (const bank of bankColumns) {
        const fee = row.c[bank.column];
        const note = row.notes?.[bank.column];
        const headerNote = section.headerNotes?.[bank.column];
        if (isEmpty(fee) && !note) continue;
        if (!matches([sectionText, condition, childCountLabel(condition.split('\n')[0]), rate, term, bank.name, section.head[bank.column], fee,
          row.notes?.[0], row.notes?.[1], row.notes?.[2],
          note, headerNote].join(' '))) continue;
        if (!condition && !rate && !term) {
          limits.push({ bank, fee, note, headerNote });
          continue;
        }
        if (!children.has(condition)) children.set(condition, { rates: new Map(), notes: new Set() });
        const group = children.get(condition);
        if (row.notes?.[0]) group.notes.add(row.notes[0]);

        const number = rateNumber(rate);
        const key = Number.isFinite(number) ? number : rate;
        if (!group.rates.has(key)) group.rates.set(key, { rate, number, durations: new Map(), notes: new Set() });
        const rateGroup = group.rates.get(key);
        if (row.notes?.[1]) rateGroup.notes.add(row.notes[1]);
        if (!rateGroup.durations.has(term)) rateGroup.durations.set(term, { offers: [], notes: new Set() });
        const duration = rateGroup.durations.get(term);
        if (row.notes?.[2]) duration.notes.add(row.notes[2]);
        duration.offers.push({ bank, fee, note, headerNote });
        count++;
      }
    }
    const rows = section.rows.filter(row => row.span && bankColumns.length
      && matches([sectionText, row.c[0], row.notes?.[0]].join(' ')));
    if (terms.length) count += limits.length + rows.length;
    return { children, limits, rows, count };
  }

  function childCountLabel(number) {
    if (!/^\d+$/.test(number)) return number || 'Количество детей не указано';
    const n = Number(number);
    return `${number} ${n === 1 ? 'ребёнок' : n >= 2 && n <= 4 ? 'ребёнка' : 'детей'}`;
  }

  function groupedFamilySubsidyView(result) {
    const notices = result.rows.map(row =>
      `<div class="note h">${richText(row.c[0])}${cellNote(row.notes?.[0])}</div>`).join('');
    const limits = result.limits.map(({ bank, fee, note, headerNote }) =>
      `<div><dt>${bankLabel(bank.name, bank.id)}</dt>
        <dd>${richText(fee)}${cellNote(note, bank.name)}${cellNote(headerNote, bank.name)}</dd></div>`).join('');
    const limitBlock = limits ? `<details class="loyalty-info" open>
      <summary>Максимальный срок по банкам</summary><dl class="loyalty-context">${limits}</dl></details>` : '';
    const byChildCount = [...result.children].sort(([a], [b]) => parseInt(a, 10) - parseInt(b, 10));
    const groups = byChildCount.map(([condition, group], groupIndex) => {
      const [number, ...details] = condition.split('\n');
      const title = childCountLabel(number);
      const subtitle = details.filter(Boolean).join(' ').replace(/-\s+/g, '-');
      const rateOrder = [...group.rates.values()].sort((a, b) =>
        a.number === b.number ? 0 : a.number - b.number);
      const rates = rateOrder.map(({ rate, durations, notes }, rateIndex) => {
        const blocks = [...durations].map(([term, duration]) => {
          const ordered = [...duration.offers].sort((a, b) => a.bank.column - b.bank.column);
          const offers = ordered.map(({ bank, fee, note, headerNote }) =>
            `<div><dt>${bankLabel(bank.name, bank.id)}</dt><dd>${richText(isEmpty(fee) ? 'КВ —' : `КВ ${fee}`)}
              ${cellNote(note, `${bank.name} · КВ`)}${cellNote(headerNote, bank.name)}</dd></div>`).join('');
          const termNotes = [...duration.notes].map(note => cellNote(note, 'Срок')).join('');
          return `<section class="family-term"><h4>Срок · ${richText(term || '—')}</h4>${termNotes}
            <dl class="family-offers" aria-label="КВ по банкам">${offers}</dl></section>`;
        }).join('');
        const rateNotes = [...notes].map(note => cellNote(note, 'Ставка')).join('');
        return `<details class="family-rate"${rateIndex === 0 || terms.length ? ' open' : ''}>
          <summary>${richText(rate?.replace(/%+$/, '%') || 'Ставка не указана')}</summary>${rateNotes}${blocks}</details>`;
      }).join('');
      return `<details class="loyalty-program family-subsidy"${groupIndex === 0 || terms.length ? ' open' : ''}>
        <summary>${richText(title)}${subtitle ? `<small>${richText(subtitle)}</small>` : ''}</summary>
        ${[...group.notes].map(note => cellNote(note, 'Количество детей')).join('')}${rates}</details>`;
    }).join('');
    return notices + limitBlock + groups;
  }

  function table(section, result) {
    const columns = result.columns;
    const head = section.head.length
      ? `<thead><tr>${columns.map(index => {
        const label = section.head[index];
        return `<th scope="col">${bankLabel(label, section.bc?.[index]?.[0])}${cellNote(section.headerNotes?.[index], label)}</th>`;
      }).join('')}</tr></thead>`
      : '';
    const rows = result.rows.map(row => {
      if (row.span) {
        return `<tr><td class="span" colspan="${columns.length}">${richText(row.c[0])}${cellNote(row.notes?.[0])}</td></tr>`;
      }
      return `<tr${row.sub ? ' class="sub"' : ''}>${columns.map(index => {
        const cell = row.c[index];
        const content = normal(section.head[index]) === 'банк' ? bankLabel(cell) : richText(cell);
        return `<td${cell && isEmpty(cell) ? ' class="x"' : ''}>${content}${cellNote(row.notes?.[index], section.head[index])}</td>`;
      }).join('')}</tr>`;
    }).join('');
    return `<p class="memo-table-hint">Прокрутите таблицу, чтобы увидеть остальные столбцы.</p>
      <div class="tw" tabindex="0" role="region" aria-label="${esc(section.t)}"><table>${head}<tbody>${rows}</tbody></table></div>`;
  }

  function familyConditions(section, context) {
    const [heading, counts, , ...matrix] = section.rows.filter(row => !row.span && !row.sub);
    if (!heading || !counts || !matrix.length) return null;
    const scenarios = [];
    const columns = [];
    for (const [index, headingText] of heading.c.entries()) {
      if (!/^\d+$/.test(counts.c[index])) continue;
      if (headingText) scenarios.push(headingText);
      if (scenarios.length) columns.push({ index, children: counts.c[index], scenario: scenarios.at(-1) });
    }
    const choices = matrix.flatMap(row => columns.flatMap(({ index, children, scenario }) => {
      const [region, amount] = row.c;
      const rate = row.c[index];
      return region && amount && !isEmpty(rate) ? [{ region, amount, rate, children, scenario, row, index }] : [];
    }));
    if (!choices.length) return null;

    const rules = section.rows.filter(row => row.span);
    const groups = new Map([
      ['Как считать детей', [{ c: [counts.c[0]], notes: counts.notes }]],
      ['Льготный период', []],
      ['Регистрация', []],
    ]);
    let topic = 'Как считать детей';
    for (const row of rules) {
      if (/льготный период/i.test(row.c[0])) topic = 'Льготный период';
      if (/подтверждать регистрацию/i.test(row.c[0])) topic = 'Регистрация';
      groups.get(topic).push(row);
    }
    const hits = choices.filter(choice => matches([context, choice.region, choice.children, 'ребёнок детей',
      choice.scenario, choice.amount, choice.rate, choice.row.notes?.[choice.index]].join(' ')));
    const notesCount = [...groups].reduce((total, [title, rows]) =>
      total + rows.filter(row => matches([context, title, row.c[0], row.notes?.[0]].join(' '))).length, 0);
    return { scenarios, choices, hits, rules: groups, count: hits.length + notesCount };
  }

  function familyConditionsView(result) {
    const current = state.family;
    const regions = [...new Set(result.choices.map(choice => choice.region))];
    const children = [...new Set(result.choices.map(choice => choice.children))].sort((a, b) => Number(a) - Number(b));
    if (!regions.includes(current.region)) current.region = regions[0];
    if (!children.includes(current.children)) current.children = children[0];
    if (current.query !== state.query && terms.length && result.hits.length
        && !result.hits.some(choice => choice.region === current.region && choice.children === current.children)) {
      current.region = result.hits[0].region;
      current.children = result.hits[0].children;
    }
    current.query = state.query;
    const select = (id, label, options, selected) => `<label for="family-${id}">${label}
      <select id="family-${id}" data-family-choice="${id}">${options.map(option =>
        `<option value="${esc(option)}"${option === selected ? ' selected' : ''}>${esc(option.replace(/\s+/g, ' ').replace('СПБ/ЛО', 'СПб/ЛО'))}</option>`).join('')}</select></label>`;
    const items = result.choices.filter(choice => choice.region === current.region && choice.children === current.children);
    const cards = result.scenarios.map(scenario => {
      const label = /^семья с 1-м ребенком до 7 лет$/i.test(scenario)
        ? 'Есть ребёнок до 7 лет' : scenario.split('\n').map(line => line.replace(/^\s*-\s*/, '')).join(' / ');
      const offers = items.filter(choice => choice.scenario === scenario);
      return `<article class="family-result"><h3>${richText(label)}</h3>${offers.length ? offers.map(choice => `<dl>
        <div><dt>Ставка</dt><dd class="family-rate-value">${richText(choice.rate)}</dd></div>
        <div><dt>Макс. сумма</dt><dd>${richText(choice.amount.replace(/\s*млн$/i, ' млн ₽'))}</dd></div>
        </dl>${cellNote(choice.row.notes?.[choice.index], label)}`).join('') : '<p>Условия не указаны</p>'}</article>`;
    }).join('');
    const notes = [...result.rules].filter(([, rows]) => rows.length).map(([title, rows]) =>
      `<details${terms.length && rows.some(row => matches([title, row.c[0], row.notes?.[0]].join(' '))) ? ' open' : ''}>
        <summary>${title}</summary>${rows.map(row => `<div class="family-rule-text">${richText(row.c[0])}
          ${cellNote(row.notes?.[0], title)}</div>`).join('')}</details>`).join('');
    return `<div class="family-conditions"><div class="family-controls">
      ${select('region', 'Регион', regions, current.region)}
      ${select('children', 'Количество детей', children, current.children)}
      </div><div class="family-results" aria-live="polite">${cards}</div>
      <div class="family-rules">${notes}</div></div>`;
  }

  function entry(section, subtitle) {
    return `<a class="memo-entry" href="#${esc(section.id)}"><b>${bankLabel(section.t)}</b><small>${esc(subtitle)}</small></a>`;
  }

  function catalog() {
    return `<div class="memo-catalog">${groups.map(([title, description], index) => {
      const sections = secs.filter(section => section.g === index);
      const cards = sections.map(section =>
        entry(section, section.id === 's2' ? 'ПВ, сроки и условия банков' : section.d));
      return sections.length ? `<section><h2>${esc(title)}</h2><p>${esc(description)}</p>
        <div class="memo-grid">${cards.join('')}</div></section>` : '';
    }).join('')}</div>`;
  }

  const plural = new Intl.PluralRules('ru');
  const labels = { one: 'совпадение', few: 'совпадения', many: 'совпадений' };
  const countLabel = count => `${count} ${labels[plural.select(count)]}`;

  function searchResults() {
    const found = secs.map(section => [section, filterSection(section, true)]).filter(([, result]) => result.count);
    const total = found.reduce((sum, [, result]) => sum + result.count, 0);
    $('#status').textContent = total ? `Найдено: ${countLabel(total)}` : 'Совпадений нет';
    return total
      ? `<section class="memo-results"><h2>Разделы с совпадениями</h2><div class="memo-grid">${found.map(([section, result]) => entry(section, countLabel(result.count))).join('')}</div></section>`
      : '<p class="empty">Попробуйте другое слово или измените фильтр по банкам.</p>';
  }

  function detail(section, active) {
    const result = filterSection(section, false);
    if (active) {
      $('#status').textContent = (result.count ? `В разделе: ${countLabel(result.count)}` : 'В разделе нет совпадений') +
        (result.filterUnavailable ? '. Для этого раздела фильтр по банкам недоступен.' : '');
    }
    const nav = groups.map(([title], index) => {
      const sections = secs.filter(item => item.g === index);
      return sections.length ? `<optgroup label="${esc(title)}">${sections.map(option).join('')}</optgroup>` : '';
    }).join('');
    function option(item) {
      return `<option value="${esc(item.id)}"${item.id === section.id ? ' selected' : ''}>${esc(item.t)}</option>`;
    }
    let contents = '';
    if (comparisons.has(section.id)) contents = generalConditions(section, result, comparisons.get(section.id));
    else if (section.id === 's9') contents = standardSubsidyView(section, result);
    else if (familySubsidy(section)) contents = groupedFamilySubsidyView(result);
    else if (section.id === 's3' && result.choices && result.count) contents = familyConditionsView(result);
    else if (section.id === 's7' && result.items.length) contents = trancheView(section, result);
    else if (section.kind === 'loyalty' && result.programs) contents = loyalty(result);
    else if (section.kind === 'cards' && result.items.length) contents = `<div class="cards">${result.items.map(card).join('')}</div>`;
    else if (result.rows.length) contents = table(section, result);
    return `<section class="memo-section">
      <nav class="memo-section-nav" aria-label="Разделы памятки">
        <a class="memo-source" href="#">${active ? 'К результатам поиска' : 'Все разделы памятки'}</a>
        <label for="memo-sections">Раздел
          <select id="memo-sections">${nav}${section.g >= groups.length ? option(section) : ''}</select>
        </label>
      </nav>
      <h2 class="sh" tabindex="-1">${bankLabel(section.t)}</h2><p class="sub">${esc(section.d)}</p>
      ${(section.notes ?? []).map(([label, text]) => `<div class="note">${richText(label)}${cellNote(text, label)}</div>`).join('')}
      ${contents || '<p class="empty">Попробуйте изменить поиск или фильтр по банкам.</p>'}
      </section>`;
  }

  function render() {
    terms = searchable(state.query).trim().split(/\s+/).filter(Boolean);
    const phrases = terms.map(term => term === 'маткапитал' ? capitalAlias.source : safeRegex(term).replace(/е/g, '[её]'));
    highlight = phrases.length ? new RegExp(`(${phrases.join('|')})`, 'giu') : null;
    const section = secs.find(item => item.id === location.hash.slice(1));
    const active = Boolean(terms.length || state.banks.size);
    const filterButtons = $('#selected');
    const focusedRemoval = filterButtons.contains(document.activeElement);
    sourceUrl.searchParams.set('gid', sheetIds[section?.id] ?? '1749938485');
    source.href = sourceUrl.href;
    source.textContent = section ? 'Открыть вкладку в Google Таблице' : 'Открыть Google Таблицу';
    $('#status').textContent = '';
    app.innerHTML = section ? detail(section, active) : active ? searchResults() : catalog();
    $('#cl').style.display = state.query ? 'block' : 'none';
    $('#bn').textContent = state.banks.size;
    $('#bn').hidden = !state.banks.size;
    bankFilter.classList.toggle('on', Boolean(state.banks.size));
    $('#filters').hidden = !active;
    const selected = banks.filter(bank => state.banks.has(bank.id));
    filterButtons.innerHTML = selected.map(bank => `<button class="chip on" type="button" data-remove="${esc(bank.id)}"
      aria-label="Убрать банк ${esc(bank.n)}">${BankLogos.icon(bank.id)}${esc(bank.n)} ×</button>`).join('');
    if (focusedRemoval) (filterButtons.querySelector('button') || bankFilter).focus();
    $('#chips').querySelectorAll('button').forEach(button => {
      const pressed = state.banks.has(button.dataset.bank);
      button.setAttribute('aria-pressed', String(pressed));
      button.classList.toggle('on', pressed);
    });
  }

  function setBankPanel(open) {
    $('#bp').hidden = !open;
    bankFilter.setAttribute('aria-expanded', String(open));
  }

  $('#chips').innerHTML = banks.map(bank =>
    `<button class="chip" type="button" data-bank="${esc(bank.id)}" aria-pressed="false">${BankLogos.icon(bank.id)}${esc(bank.n)}</button>`).join('');
  bankFilter.addEventListener('click', () => setBankPanel($('#bp').hidden));
  $('#chips').addEventListener('click', event => {
    const button = event.target.closest('[data-bank]');
    if (!button) return;
    const bank = button.dataset.bank;
    if (state.banks.has(bank)) state.banks.delete(bank);
    else state.banks.add(bank);
    render();
  });
  $('#selected').addEventListener('click', event => {
    const button = event.target.closest('[data-remove]');
    if (!button) return;
    state.banks.delete(button.dataset.remove);
    render();
  });
  let timer;
  query.addEventListener('input', () => {
    clearTimeout(timer);
    state.query = query.value;
    timer = setTimeout(render, 140);
  });
  function clearQuery() {
    clearTimeout(timer);
    state.query = query.value = '';
    render();
    query.focus();
  }
  $('#cl').addEventListener('click', clearQuery);
  $('#rs').addEventListener('click', () => {
    state.banks.clear();
    clearQuery();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !$('#bp').hidden) {
      setBankPanel(false);
      bankFilter.focus();
    }
  });
  app.addEventListener('click', event => {
    const button = event.target.closest('[data-general-view]');
    const general = comparisons.get(location.hash.slice(1));
    if (!button || !general) return;
    general.view = button.dataset.generalView;
    render();
    document.getElementById(button.id).focus({ preventScroll: true });
  });
  app.addEventListener('change', event => {
    const { id, value, checked, dataset } = event.target;
    const general = comparisons.get(location.hash.slice(1));
    if (general && (dataset.compareBank !== undefined || id.startsWith('compare-'))) {
      if (dataset.compareBank !== undefined) general.banks[Number(dataset.compareBank)] = value;
      else if (id === 'compare-condition') general.condition = value;
      else if (id === 'compare-group') {
        general.group = value;
        general.condition = '';
      }
      else general.differences = checked;
      render();
      document.getElementById(id)?.focus({ preventScroll: true });
      return;
    }
    if (event.target.id === 'memo-sections') location.hash = event.target.value;
    const field = event.target.dataset.familyChoice;
    if (field === 'region' || field === 'children') {
      state.family[field] = event.target.value;
      render();
      $(`#family-${field}`).focus({ preventScroll: true });
    }
  });
  addEventListener('hashchange', () => {
    setBankPanel(false);
    render();
    const heading = $('.memo-section h2');
    const target = heading || query;
    target.focus({ preventScroll: true });
    if (window.frameElement) {
      const scrollTop = window.parent.scrollY;
      const frameTop = window.frameElement.getBoundingClientRect().top + scrollTop;
      const offset = window.parent.document.querySelector('header')?.offsetHeight ?? 0;
      if (scrollTop > frameTop - offset) window.parent.scrollTo(0, frameTop - offset);
    } else {
      window.scrollTo(0, 0);
    }
  });
  render();
}
</script>
</body></html>
