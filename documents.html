<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документы на ипотеку — подбор для клиента</title>
<style>
:root{--ink:#261e2c;--muted:#766b79;--accent:#9b287f;--accent2:#cb68ac;--bg:#f8f6f8;--line:#e9e3ea;--white:#fff;--shadow:0 18px 55px rgba(72,32,67,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Montserrat,"Segoe UI",Arial,sans-serif;line-height:1.5}button{font:inherit}header{background:white;border-bottom:1px solid var(--line)}.headinner{max-width:1160px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.back{color:#7f4773;text-decoration:none;font-weight:700;font-size:13px}.wordmark{font-weight:850;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:#a02a82}.page{max-width:1160px;margin:0 auto;padding:34px 24px 70px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;color:#a02a82;font-weight:850;margin-bottom:10px}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:28px}.pagehead h1{font-size:clamp(29px,4vw,48px);line-height:1.08;letter-spacing:-.035em;margin:0 0 12px}.pagehead p{margin:0;color:var(--muted);font-size:15px}.softmark{width:65px;height:65px;background:#f5e7f1;border-radius:22px;display:grid;place-items:center;color:var(--accent);font-size:31px;flex-shrink:0}
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);gap:24px;align-items:start}.sidebar{background:#fff;border:1px solid var(--line);border-radius:21px;padding:20px;box-shadow:0 4px 22px #55294a06;position:sticky;top:20px}.sidebar h3{margin:0 0 16px;font-size:14px}.steps{display:grid;gap:5px}.navstep{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:11px;color:#817887;font-size:13px;font-weight:650}.navstep .dot{display:grid;place-items:center;border:1px solid #ded5df;width:28px;height:28px;border-radius:50%;flex-shrink:0;font-size:12px;background:#fff}.navstep.current{background:#f9edf6;color:#8b246f}.navstep.current .dot{background:#9b287f;color:white;border-color:#9b287f}.navstep.past{color:#534956}.navstep.past .dot{border-color:#d6a7c8;color:#9b287f;background:#fcf5fa}.sidetip{margin-top:22px;padding:14px;border-radius:12px;background:#faf7fb;color:#857586;font-size:12px;line-height:1.6}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;min-height:480px;padding:38px 42px;box-shadow:var(--shadow)}.progressline{height:5px;background:#efe9ef;border-radius:10px;overflow:hidden;margin-bottom:40px}.progressline>span{display:block;height:100%;background:linear-gradient(90deg,#9a277f,#d487b9);border-radius:10px;transition:width .25s}.counter{color:var(--accent);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:11px}.questiontitle{font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;line-height:1.19;margin:12px 0 8px;font-weight:800}.questionhint{color:var(--muted);font-size:14px;margin:0 0 26px;max-width:620px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{min-height:84px;padding:19px;display:flex;align-items:center;gap:16px;border:1.5px solid var(--line);background:white;border-radius:15px;cursor:pointer;text-align:left;transition:.15s;color:#362a3a}.choice:hover{border-color:#d9a4ca;background:#fcf8fb}.choice.selected{border-color:#a82b87;background:#fcf2fa;box-shadow:inset 0 0 0 1px #a82b87}.choiceicon{display:grid;place-items:center;width:41px;height:41px;flex-shrink:0;border-radius:12px;background:#f5f1f5;color:#a02a82;font-size:20px}.choice.selected .choiceicon{background:#f0dcea}.choicetext{font-size:14px;font-weight:750;line-height:1.35;flex:1}.tick{margin-left:auto;width:19px;height:19px;border:1.5px solid #d7c9d5;border-radius:50%;flex-shrink:0}.choice.selected .tick{border:6px solid #a02a82;background:white}.footnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:37px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:12px;padding:13px 22px;min-height:49px;font-size:14px;font-weight:750;cursor:pointer;background:var(--accent);color:white;text-decoration:none}.btn.secondary{background:#f3eef3;color:#5d4760}.btn.outline{background:white;border:1px solid #dbcfdd;color:#8e2d76}.btn:disabled{opacity:.45;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(.97)}.hintbox{padding:15px 18px;background:#fbf7fa;border-left:3px solid #ba79ac;border-radius:10px;font-size:13px;color:#66596a;margin-top:18px}.hidden{display:none!important}.summary{margin-top:0;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.summaryheader{padding:32px 38px;background:linear-gradient(120deg,#fdf7fb,#fff);border-bottom:1px solid var(--line)}.summaryheader h2{font-size:30px;line-height:1.15;margin:7px 0 12px;letter-spacing:-.025em}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:white;border:1px solid #eadde8;color:#7d426f;border-radius:100px;padding:5px 11px;font-size:12px;font-weight:650}.summarybody{padding:25px 38px}.resultactions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}.resultnote{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 16px}.section{padding:20px 0 12px;border-top:1px solid var(--line)}.section:first-of-type{border-top:0}.section h3{font-size:17px;margin:0 0 13px}.doc{display:flex;align-items:flex-start;gap:12px;padding:9px 0;font-size:14px;white-space:pre-wrap}.doc input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;margin:3px 0}.doc.done span{text-decoration:line-through;color:#aaa0aa}.details{border:1px solid #ede5ed;padding:15px;border-radius:12px;margin-top:14px}.details summary{cursor:pointer;color:#833475;font-weight:700;font-size:13px}.details p{white-space:pre-wrap;font-size:13px;color:#534652;margin-top:12px}.footerhint{font-size:12px;color:#807383;line-height:1.6;margin:18px 0 0}.toast{position:fixed;bottom:22px;right:22px;background:#312436;color:#fff;padding:12px 17px;border-radius:12px;z-index:3;box-shadow:var(--shadow);font-size:13px}.mini{color:#a02a82;font-size:12px;font-weight:700}
@media(max-width:820px){.layout{grid-template-columns:1fr}.sidebar{position:static;padding:15px}.sidebar h3,.sidetip{display:none}.steps{display:flex;overflow:auto}.navstep{min-width:max-content;font-size:12px}.page{padding:22px 14px 45px}.panel{padding:25px 19px;min-height:410px}.summaryheader,.summarybody{padding:24px 20px}}
@media(max-width:560px){.pagehead{align-items:center}.softmark{display:none}.choices{grid-template-columns:1fr}.choice{min-height:70px}.footnav .btn{flex:1}.resultactions .btn{width:100%}.summaryheader h2{font-size:24px}}
@media print{header,.pagehead,.sidebar,.panel,.resultactions,.details,.footerhint,.resultnote,.doc input{display:none!important}body{background:white}.page{padding:0;max-width:none}.layout{display:block}.summary{box-shadow:none;border:0}.summaryheader{padding:8px 0 15px;background:white}.summarybody{padding:0}.doc.done{display:none}.doc{padding:4px 0}.doc span{text-decoration:none!important;color:#222!important}.section{break-inside:avoid}@page{size:A4;margin:15mm}}
</style></head><body><header><div class="headinner"><a class="back" href="./#home">← К базе знаний</a><span class="wordmark">Отдел ипотеки</span></div></header><main class="page"><div class="pagehead"><div><div class="eyebrow">Инструменты менеджера</div><h1>Документы на ипотеку</h1><p>Ответьте на вопросы — получите готовый список для клиента.</p></div><div class="softmark">▤</div></div><div class="layout"><aside class="sidebar"><h3>Подбор документов</h3><div class="steps" id="steps"></div><div class="sidetip">Перечень составляется по актуальной рабочей таблице отдела. Данные клиента на сайте не сохраняются.</div></aside><div><section class="panel" id="questionnaire"><div class="progressline"><span id="progress"></span></div><div id="questions"></div></section><section class="summary hidden" id="result"></section></div></div></main>
<script src="./documents-data.js?v=20261119"></script>
<script>

const D=window.DOCUMENT_RULES;
const state={program:"family",marital:"single",citizenship:"rf",exception:"rf",spouse:"no",job:"official",capital:"no",ip:"usn",idx:0,done:new Set()};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labels={family:"Семейная ипотека",it:"IT-ипотека",standard:"Стандартная ипотека",official:"По найму · официальный доход",partial:"По найму · часть дохода неофициальная",military:"Военнослужащий",company:"ООО",ip_usn:"ИП · УСН",ip_patent:"ИП · патент",self:"Самозанятый"};
function qs(){
 const q=[
 {key:"program",title:"Какую ипотечную программу оформляет клиент?",hint:"Выберите программу, чтобы подобрать соответствующий комплект документов.",opts:[["family","Семейная ипотека","⌂"],["it","IT-ипотека","⌘"],["standard","Стандартная ипотека","▤"]]},
 {key:"marital",title:"Какое семейное положение у клиента?",hint:"Для супругов могут потребоваться дополнительные документы.",opts:[["single","Не состоит в браке","◯"],["married","Состоит в браке","♡"]]}
 ];
 if(state.program==="standard")q.push({key:"citizenship",title:"Какое гражданство у заёмщика?",hint:"В источнике есть отдельный комплект для иностранного гражданина.",opts:[["rf","Гражданство РФ","▣"],["foreign","Иностранное гражданство","◎"]]});
 if(state.program==="family"&&state.marital==="married")q.push({key:"exception",title:"Какой статус у второго супруга?",hint:"Источник отдельно выделяет исключения для иностранного гражданина и участника НИС.",opts:[["rf","Оба супруга — граждане РФ","♡"],["foreign","Второй супруг — иностранец или участник НИС","◎"]]});
 if(state.marital==="married"&&state.program!=="family")q.push({key:"spouse",title:"Будет ли супруг(а) участвовать в заявке?",hint:"Если участвует, добавим документы супруга из актуальной таблицы.",opts:[["yes","Да, будет участвовать","✓"],["no","Нет","×"]]});
 if(state.program==="family")q.push({key:"capital",title:"Материнский капитал используется в первоначальном взносе?",hint:"При использовании маткапитала потребуются дополнительные документы.",opts:[["yes","Да, используем","✓"],["no","Нет","×"]]});
 q.push({key:"job",title:"Как клиент подтверждает занятость и доход?",hint:state.program==="it"?"В таблице для IT-ипотеки указаны два варианта подтверждения дохода.":"Выберите соответствующую категорию занятости.",opts:state.program==="it"?[["official","По найму · официальный доход","▤"],["partial","По найму · не весь доход официальный","▥"]]:[["official","По найму · официальный доход","▤"],["partial","По найму · не весь доход официальный","▥"],["military","Военнослужащий","☆"],["company","ООО","▦"],["ip_usn","ИП · УСН","◈"],["ip_patent","ИП · патент","◈"],["self","Самозанятый","◇"]]});
 return q;
}
function showStep(){
 const questions=qs();state.idx=Math.min(state.idx,questions.length-1);const q=questions[state.idx];$('#result').classList.add('hidden');$('#questionnaire').classList.remove('hidden');
 $('#progress').style.width=Math.round((state.idx+1)/questions.length*100)+"%";
 $('#steps').innerHTML=questions.map((x,i)=>'<div class="navstep '+(i===state.idx?'current':i<state.idx?'past':'')+'"><span class="dot">'+(i<state.idx?'✓':i+1)+'</span><span>'+esc(x.key==="program"?"Программа":x.key==="marital"?"Семейное положение":x.key==="job"?"Занятость":x.key==="citizenship"?"Гражданство":x.key==="exception"?"Супруг":x.key==="capital"?"Маткапитал":"Участие супруга")+'</span></div>').join('');
 const body='<div class="counter">Вопрос '+(state.idx+1)+' из '+questions.length+'</div><h2 class="questiontitle">'+esc(q.title)+'</h2><p class="questionhint">'+esc(q.hint)+'</p><div class="choices">'+q.opts.map(([val,name,icon])=>'<button class="choice '+(state[q.key]===val?'selected':'')+'" type="button" data-value="'+esc(val)+'"><span class="choiceicon">'+esc(icon)+'</span><span class="choicetext">'+esc(name)+'</span><span class="tick"></span></button>').join('')+'</div><div class="footnav"><button type="button" class="btn secondary" id="prev" '+(state.idx===0?'disabled':'')+'>← Назад</button><button type="button" class="btn" id="next">'+(state.idx===questions.length-1?'Сформировать список →':'Далее →')+'</button></div>';
 $('#questions').innerHTML=body;
 document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{state[q.key]=el.dataset.value;if(q.key==="program")state.job="official";if(q.key==="marital"&&state.marital==="single")state.spouse="no";showStep()});
 $('#prev').onclick=()=>{if(state.idx>0){state.idx--;showStep()}};
 $('#next').onclick=()=>{if(state.idx===qs().length-1)showResult();else{state.idx++;showStep()}};
}
function splitSource(raw){const text=String(raw||"").trim(),cut=text.search(/\n\s*Инструкция как выгрузить документы из Госуслуг:|\n\s*Имейте ввиду в дальнейшем на сделку потребуется:|\n\s*Примечание:/i);return cut>=0?{list:text.slice(0,cut).trim(),more:text.slice(cut).trim()}:{list:text,more:""}}
function lines(raw){return raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^[-•]\s*/,"").trim())}
function docGroups(){
 const p=D.programs[state.program];let personal="",notes=[];
 if(state.program==="family"){personal=state.marital==="single"?p.personal.single:(state.exception==="rf"?p.personal.married:p.personal.exception);if(state.marital==="married")notes.push(state.exception==="rf"?p.notes.married:p.notes.exception)}
 if(state.program==="it"){personal=state.marital==="single"?p.personal.single:p.personal.married;if(state.marital==="married"){notes.push(p.notes.married);if(state.spouse==="yes")notes.push(p.notes.spouse)}}
 if(state.program==="standard"){personal=state.citizenship==="foreign"?p.personal.foreign:(state.marital==="married"?p.personal.married:p.personal.single);if(state.marital==="married"&&state.spouse==="yes")notes.push(state.citizenship==="foreign"?p.notes.spouseForeign:p.notes.spouseRF)}
 const a=splitSource(personal),b=splitSource(p.employment[state.job]);
 const personalDocs=lines(a.list).filter(x=>state.program!=="family"||state.capital==="yes"||!/выписка об остатке по материнскому капиталу|сертификат по материнскому капиталу/i.test(x));
 return {groups:[{title:"Личные документы",docs:personalDocs},{title:"Занятость и подтверждение дохода",docs:lines(b.list)}],notes:[...notes,a.more,b.more].filter(Boolean)};
}
let current=null;
function copyList(){let result="Документы для подачи заявки на ипотеку\n"+labels[state.program]+"\n\n";for(const g of current.groups){const docs=g.docs.filter((_,i)=>!state.done.has(g.title+":"+i));if(docs.length)result+=g.title+":\n"+docs.map(x=>"• "+x).join("\n")+"\n\n"}return result.trim()}
function toast(msg){const div=document.createElement('div');div.className="toast";div.textContent=msg;document.body.append(div);setTimeout(()=>div.remove(),2200)}
function copy(t){const fallback=()=>{const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();document.execCommand("copy");a.remove();toast("Список скопирован")};navigator.clipboard?.writeText?navigator.clipboard.writeText(t).then(()=>toast("Список скопирован"),fallback):fallback()}
function showResult(){
 current=docGroups();state.done=new Set();$('#questionnaire').classList.add('hidden');$('#result').classList.remove('hidden');$('#steps').innerHTML='<div class="navstep past"><span class="dot">✓</span><span>Ответы получены</span></div><div class="navstep current"><span class="dot">✓</span><span>Список документов</span></div>';
 let html='<div class="summaryheader"><div class="eyebrow">Готово к отправке клиенту</div><h2>Список документов</h2><div class="chips"><span class="chip">'+esc(labels[state.program])+'</span><span class="chip">'+esc(state.marital==="married"?"В браке":"Не состоит в браке")+'</span><span class="chip">'+esc(labels[state.job])+'</span></div></div><div class="summarybody"><p class="resultnote">Отмечайте уже полученные документы. При копировании и сохранении в PDF они будут исключены.</p><div class="resultactions"><button type="button" class="btn" id="copy">⧉ Скопировать для клиента</button><button type="button" class="btn secondary" id="pdf">↓ Сохранить PDF</button><button type="button" class="btn outline" id="edit">← Изменить ответы</button></div>';
 current.groups.forEach((g,k)=>{html+='<div class="section"><h3>'+esc(g.title)+'</h3>'+(g.docs.length?g.docs.map((d,i)=>'<label class="doc"><input type="checkbox" data-group="'+k+'" data-row="'+i+'"><span>'+esc(d)+'</span></label>').join(''):'<p class="resultnote">Перечень не указан в исходной таблице.</p>')+'</div>'});
 if(current.notes.length)html+='<details class="details"><summary>Подсказки менеджеру и инструкции из источника</summary>'+current.notes.map(s=>'<p>'+esc(s)+'</p>').join('')+'</details>';
 html+='<p class="footerhint">Перечень составлен по рабочей Google Таблице. Для нестандартных ситуаций необходимо подтвердить требования у ипотечного брокера. <a href="'+esc(D.source)+'" target="_blank" rel="noopener">Посмотреть источник ↗</a></p></div>';
 $('#result').innerHTML=html;
 document.querySelectorAll('.doc input').forEach(el=>el.onchange=()=>{const g=current.groups[+el.dataset.group];const key=g.title+":"+el.dataset.row;el.checked?state.done.add(key):state.done.delete(key);el.parentElement.classList.toggle("done",el.checked)});
 $('#copy').onclick=()=>copy(copyList());$('#pdf').onclick=()=>window.print();$('#edit').onclick=()=>{state.idx=0;showStep()};scrollTo({top:0,behavior:"smooth"});
}
showStep();
</script></body></html>
