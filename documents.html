pacity:.45;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(.97)}.hintbox{padding:15px 18px;background:#fbf7fa;border-left:3px solid #ba79ac;border-radius:10px;font-size:13px;color:#66596a;margin-top:18px}.hidden{display:none!important}.summary{margin-top:0;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.summaryheader{padding:32px 38px;background:linear-gradient(120deg,#fdf7fb,#fff);border-bottom:1px solid var(--line)}.summaryheader h2{font-size:30px;line-height:1.15;margin:7px 0 12px;letter-spacing:-.025em}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:white;border:1px solid #eadde8;color:#7d426f;border-radius:100px;padding:5px 11px;font-size:12px;font-weight:650}.summarybody{padding:25px 38px}.resultactions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}.resultnote{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 16px}.section{padding:20px 0 12px;border-top:1px solid var(--line)}.section:first-of-type{border-top:0}.section h3{font-size:17px;margin:0 0 13px}.doc{display:flex;align-items:flex-start;gap:12px;padding:9px 0;font-size:14px;white-space:pre-wrap}.doc:before{content:"•";color:#ab3e89;font-weight:900;flex-shrink:0}.client-notes{margin-top:22px;padding:21px 22px;background:#fdf2fa;border:1px solid #e4c1dc;border-left:5px solid #a52e86;border-radius:15px;break-inside:avoid}.client-notes h3{margin:0 0 10px;color:#84216c;font-size:18px}.client-notes p{white-space:pre-wrap;font-size:14px;line-height:1.65;margin:12px 0 0;color:#49384c}.client-notes p+p{border-top:1px solid #e9cfe2;padding-top:12px}.footerhint{font-size:12px;color:#807383;line-height:1.6;margin:18px 0 0}.toast{position:fixed;bottom:22px;right:22px;background:#312436;color:#fff;padding:12px 17px;border-radius:12px;z-index:3;box-shadow:var(--shadow);font-size:13px}.mini{color:#a02a82;font-size:12px;font-weight:700}

<link rel="stylesheet" href="./site-consistency.css?v=1"><link rel="stylesheet" href="./uoii-reference-style.css?v=2"></head><body><header><div class="headinner"><a class="back" href="./#home" data-site-back aria-label="Вернуться назад">← Назад</a><div class="headtools"><span class="wordmark">Отдел ипотеки</span><div class="sw" role="group" aria-label="Тема оформления"><button type="button" data-t="light" aria-pressed="true">Светлая</button><button type="button" data-t="dark" aria-pressed="false">Тёмная</button></div></div></div></header><div class="stripe" aria-hidden="true"></div><main class="page"><div class="pagehead"><div><div class="eyebrow">Инструменты менеджера</div><h1>Документы на ипотеку</h1><p>Ответьте на вопросы — получите готовый список для клиента.</p></div><div class="softmark">▤</div></div><div class="layout"><aside class="sidebar"><h3>Подбор документов</h3><div class="steps" id="steps"></div><div class="sidetip">Перечень составляется по актуальной рабочей таблице отдела. Данные клиента на сайте не сохраняются.</div></aside><div><section class="panel" id="questionnaire"><div class="progressline"><span id="progress"></span></div><div id="questions"></div></section><section class="summary hidden" id="result"></section></div></div></main>

<script>

const D=window.DOCUMENT_RULES;
const state={program:"family",marital:"single",citizenship:"rf",spouse:"no",spouseCitizenship:"rf",job:"official",spouseIncome:"no",spouseJob:"official",capital:"no",ip:"usn",idx:0,done:new Set()};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const labels={family:"Семейная ипотека",it:"IT-ипотека",standard:"Стандартная ипотека",official:"По найму · официальный доход",partial:"По найму · доход частично неофициальный",company:"ООО",ip_usn:"ИП · УСН",ip_patent:"ИП · патент",self:"Самозанятый"};
function qs(){
 const q=[
 {key:"program",title:"Какую ипотечную программу оформляет клиент?",hint:"Выберите программу, чтобы подобрать соответствующий комплект документов.",opts:[["family","Семейная ипотека","⌂"],["it","IT-ипотека","⌘"],["standard","Стандартная ипотека","▤"]]},
 {key:"marital",title:"Какое семейное положение у клиента?",hint:"Для супругов могут потребоваться дополнительные документы.",opts:[["single","Не состоит в браке","◯"],["married","Состоит в браке","♡"]]}
 ];
 if(state.program==="standard")q.push({key:"citizenship",title:"Какое гражданство у заёмщика?",hint:"В источнике есть отдельный комплект для иностранного гражданина.",opts:[["rf","Гражданство РФ","▣"],["foreign","Иностранное гражданство","◎"]]});
 if(state.marital==="married"&&state.program!=="family")q.push({key:"spouse",title:"Будет ли второй супруг (супруга) участвовать в заявке?",hint:"При участии обоих супругов необходимые документы будут добавлены в итоговый список.",opts:[["yes","Да, будет участвовать","✓"],["no","Нет","×"]]});
 if(state.program==="standard"&&state.marital==="married"&&state.spouse==="yes"&&state.citizenship==="foreign")q.push({key:"spouseCitizenship",title:"Какое гражданство у второго участника сделки (супруга или супруги)?",hint:"Перечень документов зависит от гражданства второго участника сделки.",opts:[["rf","Гражданство РФ","▣"],["foreign","Иностранное гражданство","◎"]]});
 if(state.program==="family")q.push({key:"capital",title:"Материнский капитал используется в первоначальном взносе?",hint:"При использовании маткапитала потребуются дополнительные документы.",opts:[["yes","Да, используем","✓"],["no","Нет","×"]]});
 const employmentChoices=state.program==="it"?[["official","По найму · официальный доход","▤"],["partial","По найму · доход частично неофициальный","▥"]]:[["official","По найму · официальный доход","▤"],["partial","По найму · доход частично неофициальный","▥"],["company","ООО","▦"],["ip_usn","ИП · УСН","◈"],["ip_patent","ИП · патент","◈"],["self","Самозанятый","◇"]];
 q.push({key:"job",title:"Как заёмщик подтверждает занятость и доход?",hint:state.program==="it"?"В таблице для IT-ипотеки указаны два варианта подтверждения дохода.":"Выберите подходящую категорию занятости.",opts:employmentChoices});
 const bothSpouses=state.marital==="married"&&(state.program==="family"||state.spouse==="yes");
 if(bothSpouses){
   q.push({key:"spouseIncome",title:"Будет ли супруг(а) подтверждать доход?",hint:"Если доход второго участника сделки учитывается в заявке, добавим его подтверждающие документы.",opts:[["yes","Да, с подтверждением дохода","✓"],["no","Нет, без подтверждения дохода","×"]]});
   if(state.spouseIncome==="yes")q.push({key:"spouseJob",title:"Какой формат занятости у созаёмщика (супруга или супруги)?",hint:"Выберите вариант занятости второго участника сделки. Документы для него появятся отдельным блоком.",opts:employmentChoices});
 }
 return q;
}
function showStep(){
 const questions=qs();state.idx=Math.min(state.idx,questions.length-1);const q=questions[state.idx];$('#result').classList.add('hidden');$('#questionnaire').classList.remove('hidden');
 $('#progress').style.width=Math.round((state.idx+1)/questions.length*100)+"%";
 $('#steps').innerHTML=questions.map((x,i)=>'<div class="navstep '+(i===state.idx?'current':i<state.idx?'past':'')+'"><span class="dot">'+(i<state.idx?'✓':i+1)+'</span><span>'+esc(x.key==="program"?"Программа":x.key==="marital"?"Семейное положение":x.key==="job"?"Занятость":x.key==="citizenship"?"Гражданство":x.key==="capital"?"Маткапитал":x.key==="spouseCitizenship"?"Гражданство второго участника":x.key==="spouseIncome"?"Доход созаёмщика":x.key==="spouseJob"?"Занятость созаёмщика":"Участие второго участника")+'</span></div>').join('');
 const body='<div class="counter">Вопрос '+(state.idx+1)+' из '+questions.length+'</div><h2 class="questiontitle">'+esc(q.title)+'</h2><p class="questionhint">'+esc(q.hint)+'</p><div class="choices">'+q.opts.map(([val,name,icon])=>'<button class="choice '+(state[q.key]===val?'selected':'')+'" type="button" data-value="'+esc(val)+'"><span class="choiceicon">'+esc(icon)+'</span><span class="choicetext">'+esc(name)+'</span><span class="tick"></span></button>').join('')+'</div><div class="footnav"><button type="button" class="btn secondary" id="prev" '+(state.idx===0?'disabled':'')+'>← Назад</button><button type="button" class="btn" id="next">'+(state.idx===questions.length-1?'Сформировать список →':'Далее →')+'</button></div>';
 $('#questions').innerHTML=body;
 document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{state[q.key]=el.dataset.value;if(q.key==="program"){state.job="official";state.spouseJob="official";state.spouseIncome="no"}if(q.key==="marital"&&state.marital==="single"){state.spouse="no";state.spouseIncome="no"}if(q.key==="spouse"&&state.spouse==="no")state.spouseIncome="no";showStep()});
 $('#prev').onclick=()=>{if(state.idx>0){state.idx--;showStep()}};
 $('#next').onclick=()=>{if(state.idx===qs().length-1)showResult();else{state.idx++;showStep()}};
}
function splitSource(raw){const text=String(raw||"").trim(),cut=text.search(/\n\s*Инструкция: как выгрузить документы из Госуслуг:|\n\s*Имейте в виду, что в дальнейшем для сделки потребуется:|\n\s*Примечание:/i);return cut>=0?{list:text.slice(0,cut).trim(),more:text.slice(cut).trim()}:{list:text,more:""}}
function lines(raw){return raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^[-•]\s*/,"").trim()).map(x=>x.replace(/^([а-яё])/u,(_,letter)=>letter.toLocaleUpperCase("ru-RU")))}
function docGroups(){
 const p=D.programs[state.program];let personal="";
 // Тексты про условия участия супруга — правила опроса, а не текст клиентской памятки.
 if(state.program==="family")personal=state.marital==="single"?p.personal.single:p.personal.married;
 if(state.program==="it")personal=state.marital==="single"?p.personal.single:p.personal.married;
 if(state.program==="standard")personal=state.citizenship==="foreign"?p.personal.foreign:(state.marital==="married"?p.personal.married:p.personal.single);
 const a=splitSource(personal),b=splitSource(p.employment[state.job]);
 const personalDocs=lines(a.list).filter(x=>state.program!=="family"||state.capital==="yes"||!/выписка об остатке по материнскому капиталу|сертификат (?:на|по) материнскому капиталу/i.test(x));
 const groups=[{title:"Личные документы",docs:personalDocs}];
 if(state.marital==="married"&&state.spouse==="yes"&&state.program!=="family"){
   const rf=["Номер телефона супруга или супруги, привязанный к Госуслугам","Паспорт супруга или супруги — все страницы, включая пустые (9 разворотов)","СНИЛС супруга или супруги","ИНН супруга или супруги"];
   const foreign=lines(D.programs.standard.personal.foreign).map(x=>x.replace(/иностранного гражданина/i,"второго участника сделки — иностранного гражданина"));
   const spouseDocs=state.program==="standard"&&state.citizenship==="foreign"&&state.spouseCitizenship==="foreign"?foreign:rf;
   groups.push({title:"Документы второго участника сделки (супруга или супруги)",docs:spouseDocs});
 }
 groups.push({title:"Занятость и подтверждение дохода заёмщика",docs:lines(b.list)});
 const hasSecondIncome=state.marital==="married"&&(state.program==="family"||state.spouse==="yes")&&state.spouseIncome==="yes";
 const spouseWork=hasSecondIncome?splitSource(p.employment[state.spouseJob]):null;
 if(spouseWork)groups.push({title:"Занятость и подтверждение дохода созаёмщика (супруга или супруги)",docs:lines(spouseWork.list)});
 // Исключаем повторный запрос одного и того же документа в разных блоках.
 for(const group of groups){
   const seen=new Set();
   group.docs=group.docs.filter(doc=>{
     const key=doc.replace(/[.;]+$/g,"").replace(/\s+/g," ").trim().toLocaleLowerCase("ru-RU");
     if(seen.has(key))return false;
     seen.add(key);return true;
   });
 }
 const familySpouseNote=state.program==="family"&&state.marital==="married"?"С 01.02.2026 оба супруга обязаны участвовать в кредитном договоре по семейной ипотеке. Исключение — супруг(а), являющийся нерезидентом.":"";
 return {groups,notes:[familySpouseNote,a.more,b.more,spouseWork?.more].filter(Boolean).filter((note,i,all)=>all.indexOf(note)===i)};
}

function toast(msg){const div=document.createElement('div');div.className="toast";div.textContent=msg;document.body.append(div);setTimeout(()=>div.remove(),2200)}
function copy(t){const fallback=()=>{const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();document.execCommand("copy");a.remove();toast("Список скопирован")};navigator.clipboard?.writeText?navigator.clipboard.writeText(t).then(()=>toast("Список скопирован"),fallback):fallback()}

 current.groups.forEach(g=>{html+='<div class="section"><h3>'+esc(g.title)+'</h3>'+(g.docs.length?g.docs.map(d=>'<div class="doc"><span>'+esc(d)+'</span></div>').join(''):'<p class="resultnote">Перечень не указан в исходной таблице.</p>')+'</div>'});
 if(current.notes.length)html+='<section class="client-notes"><h3>Важно для клиента · Дополнительные условия и инструкции</h3>'+current.notes.map(s=>'<p>'+esc(s)+'</p>').join('')+'</section>';
 html+='<p class="footerhint">Перечень составлен по рабочей Google Таблице. Для нестандартных ситуаций необходимо подтвердить требования у ипотечного брокера. <a href="'+esc(D.source)+'" target="_blank" rel="noopener">Посмотреть источник ↗</a></p></div>';
 $('#result').innerHTML=html;
 
 $('#copy').onclick=()=>copy(copyList());$('#pdf').onclick=()=>window.print();$('#edit').onclick=()=>{state.idx=qs().length-1;showStep()};scrollTo({top:0,behavior:"smooth"});
