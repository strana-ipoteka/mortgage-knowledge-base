<script>
const SECTIONS=[{"id":"banks-memo","title":"Памятка Банки России 3.0","desc":"Информация по ипотечным программам","url":"./memo-original.html"},{"id":"banks-table","title":"Таблица Банки 3.0","desc":"Условия банков и программы","url":"https://docs.google.com/spreadsheets/d/1BIwMWMBAB7LR9MbR5qGrIXYbq_LdFshCPz1Q_l-Mqcs/edit?gid=1749938485"},{"id":"credit-history","title":"ПРОВЕРКА КИ","desc":"Пошаговая памятка ОКБ: просмотр и скачивание PDF","url":"./credit-history.html"},{"id":"documents","title":"Документы на ипотеку","desc":"Интерактивный подбор и список документов для клиента","url":"./documents.html"},{"id":"navigator","title":"Ипотечный навигатор","desc":"От менеджера продаж к ипотечному брокеру","internal":true},{"id":"competitors","title":"Анализ конкурентов","desc":"Материалы готовятся","pending":true},{"id":"training","title":"Видеообучение по Банки 3.0","desc":"Ссылка на видео ожидается","pending":true},{"id":"calculators","title":"Калькуляторы","desc":"Семейная, комбо и базовый расчёт","internal":true},{"id":"team","title":"Структура отдела","desc":"Региональная структура, без публикации личных контактов","internal":true},{"id":"insurance","title":"Страхование","desc":"Партнёры и виды страхования","internal":true},{"id":"faq","title":"Часто задаваемые вопросы","desc":"73 вопросов по 7 темам","internal":true},{"id":"channel","title":"Знай больше — продавай увереннее!","desc":"Канал в MAX: ссылка готовится","pending":true}], FAQ=[{"topic":"Ипотека траншами","qa":[{"q":"Возможно ли частичное досрочное погашение (ЧДП) или полное досрочное погашение кредита по ипотеке траншами?","a":"Пока действует первый транш, по досрочному гашению можно сокращать только ежемесячный платеж, срок нельзя. Сокращать срок можно только в том случае, когда переведен последний транш клиенту"},{"q":"Можно ли перейти с траншевой ипотеки на программу с господдержкой (например, семейную ипотеку) через рефинансирование?","a":"Да, можно, в случае, если выданы все транши"},{"q":"Можно ли использовать субсидии (материнский капитал, региональные выплаты) для погашения ипотеки траншами?","a":"Да, возможно. При направлении средств МСК в частичное досрочное погашение необходимо учесть, что транш после поступления средств МСК не должен быть погашен полностью. Если получены не все транши, то с сокращением платежа, если получены все транши, с сокращением срока"},{"q":"В какие сроки и на каких условиях допускается расторжение кредитного договора?","a":"После  полного погашения первого транша, если не выдан второй транш. Если выданы все транши, то только после погашения всей суммы кредита"},{"q":"Какое максимальное количество траншей предусмотрено?","a":"5 траншей"},{"q":"Какой максимальный срок, в течение которого должны быть выданы все транши?","a":"Если транши по ДКП: мах срок 2 года, если транши по ДДУ: мах срок 3 года, НО до ввода дома в эксплуатацию"},{"q":"Как получить следующий транш — что для этого нужно?","a":"В настоящее время транши Сбербанком перечисляются автоматически, в случае если, автоматического зачисления не произошло, клиенту необходимо обратиться в Дом Клик, либо в любой офис Сбербанка"},{"q":"Минимальная сумма первого транша?","a":"Не менее 100 000 рублей"}]},{"topic":"Семейная ипотека","qa":[{"q":"Можно ли исключить супруга из состава участников сделки (из заявки, кредитного договора, ДДУ)?","a":"Нет. С 1 февраля 2026 года супруги по семейной ипотеке — обязательные созаёмщики, брачным договором исключить их из сделки нельзя. Исключения: супруг — иностранный гражданин, либо участник накопительно-ипотечной системы (военная ипотека). По ранее оформленным кредитам вывод супруга возможен только с согласия банка через брачный договор, соглашение о разделе имущества или развод."},{"q":"Требуется ли прописка детей ?","a":"Нет. С 1 октября 2026 гда отменено требование предоставления постоянной регистрации ребенка по месту жительства."},{"q":"При каких условиях допускается оформление второй семейной ипотеки?","a":"Когда будет закрыта предыдущая семейная ипотека и рожден еще один ребенок."},{"q":"Возможно ли оформить семейную ипотеку, если клиент (или супруг/супруга) ранее участвовал в льготной ипотечной программе после 23.12.2023, а затем вышел из числа участников?","a":"Нет. Т.к. после 23.12.2023 года возможно оформить олько одну льготную программу в \"одни руки\". А с 01.02.2026 г оба супруга, если они в официальном браке, должны участовать в кредитном договоре. Даже если он вышел из состава участников, право на семейную ипотеку он использовал"},{"q":"Каков порядок оформления семейной ипотеки, если родители ребёнка не состоят в браке либо находятся в разводе?","a":"Первый из родителей, кто оформляет Семейную ипотеку лишает право второго родителя. Второй родитель не может фоормить Семейную ипотеку."},{"q":"Как учитываются дети от предыдущих браков при оформлении семейной ипотеки?","a":"Учитываются дети основного заемщика"},{"q":"По какому принципу учитывается количество детей для определения условий семейной ипотеки (ставки, лимитов)?","a":"Учитываются дети основного заемщика"},{"q":"Кто из участников сделки обязан подтверждать регистрацию по месту жительства, и на каком этапе это требуется?","a":"Регистрацию обязан подтверждать основной заемщик, после получения права собственности, в течение 5 лет"},{"q":"Допускается ли рефинансирование семейной ипотеки в другом банке?","a":"Да, допускается, в зависимости от банка."},{"q":"Какой размер процентной ставки будет применяться с 16‑го года кредита по семейной ипотеке?","a":"По истечении 15 лет размер льготной процентной ставки будет изменен и установлен как минимальное из значений: \n-        Процентная ставка на дату заключения кредитного договора, увеличенная на 4 п. п.\n-        Или ключевая ставка ЦБ РФ, действующая на первое число месяца, в котором истек срок 15 лет, увеличенная на 3 п. п."},{"q":"Предусмотрена ли возможность снижения процентной ставки по семейной ипотеке после рождения ещё одного ребёнка?","a":"Да."},{"q":"Какие условия необходимо выполнить, чтобы получить льготную ставку 6 % по семейной ипотеке?","a":"ставка 6% по Семейной ипотеке будет при одном из условий:\n1. Есть трое детей, одному из которых до 7 лет\n2. Первоначальный взнос от 50,1%\n3. Есть ребенок- инвалид, которому до 18 лет"},{"q":"Как рассчитать субсидированную ставку по Семейной ипотеке, если клиент подходит под ставку 6% (ребенок-инвалид или пв 50%)?","a":"Считаем дисконт от ставки 6% во вкладке \"Субсидии Семейная ипотека\" в таблице Банки России 3.0."},{"q":"Можно ли увеличить срок кредита с 15 до 30 лет посредством рефинансирования в другом банке?","a":"Возможно, в зависимости от банка."},{"q":"Допустимо ли с помощью брачного договора исключить одного из супругов из ДДУ, если супруги находятся на стадии развода, и как это повлияет на раздел залоговой квартиры?","a":"Допустимо, если процесс еще не завершен, повлияет положительно- раздела не будет"},{"q":"Возможен ли переход с рассрочки  (по ДКП) на семейную ипотеку?","a":"Невозможен. Даже  при расторжении, если было ДКП перейти на Семейную ипотеку нельзя, так как в ЕГРН предыдущий собственник уже физ лицо"},{"q":"Допускается ли оформление семейной ипотеки на срок 30 лет?","a":"Да."},{"q":"Как влияет факт банкротства супруга (в том числе при отсутствии у него дохода) на возможность одобрения семейной ипотеки?","a":"Отрицательно."}]},{"topic":"Плохая КИ/Банкроты/Закредитованность","qa":[{"q":"Оформление сделки при плохой кредитной истории, банкротстве и высокой кредитной нагрузке.","a":"При банкротстве оформление льготной ( Семейная и ИТ-ипотека)  ипотеки невозможно, по Стандартной программе возможно, по истечению 5 лет. Необходимо проанализировать кредитный отчет и исправить кредитную историю, снизить кредитную нагрузку."},{"q":"Возможно ли одобрение ипотеки, если супруг или супруга в прошлом проходили процедуру банкротства, в том числе когда банкрот выступает созаёмщиком без подтверждённого дохода?","a":"При банкротстве оформление льготной ( Семейная и ИТ-ипотека)  ипотеки невозможно, по Стандартной программе возможно, по истечению 5 лет. По Стандартной ипотеке возможно исключить банкрота из сделки."},{"q":"По истечении какого срока после завершения процедуры банкротства банк готов одобрить ипотечный кредит?","a":"По истечении 5 лет по Стандартной программе. По льготной программе подача заявки недопустима."},{"q":"Какие основные рекомендации по восстановлению кредитной истории?","a":"Снизить количество кредитных продуктов, закрыть имеющиеся  текущие просрочки, уменьшить лимиты по действующим кредитным картам, закрыть микрозаймы."},{"q":"Каковы шансы на одобрение кредита, если у клиента в прошлом были длительные просрочки по платежам?","a":"Если в прошлом у клиета имелись просрочки 180+, передача в коллекторские агенства или принудительные взыскания через ФССП, шансы крайне низкие."},{"q":"Какой минимальный кредитный рейтинг необходим для одобрения ипотечного кредита?","a":"Зависит от кредитного бюро: в  НБКИ 600 баллов, ОКБ не менее 500 баллов."},{"q":"В течение какого периода в кредитной истории клиента обновляется информация после погашения просроченной задолженности?","a":"По закону о кредитных историях в течение 2-3 рабочих дней банк обязан передать сведения во все БКИ. ( Бюро Кредитных Историй)"},{"q":"Может ли супруг получить одобрение по кредиту, если его официальная супруга (супруг) признана банкротом?","a":"Только по Стандартной ипотеке, только исключением из сделки супруга-банкрота."},{"q":"Как влияет высокая долговая нагрузка клиента на вероятность одобрения кредита?","a":"Влияет негативно, в каждом банке свои расчетные коэффициенты. У клиента должно оставаться на руках не менее 50% от его дохода, включая расходы по действующим кредитам и платежом по заявке на текущую ипотеку."}]},{"topic":"Субсидирование","qa":[{"q":"На какой срок допустимо субсидирование процентной ставки?","a":"Субсидирование ставки возможно только на весь срок кредита"},{"q":"Как определить размер комиссионного вознаграждения ?","a":"Комиссия устанавливается матрицей банка, в том числе она будет зависеть от программы, срока ипотеки, желаемой ставки. Все актуальные матрицы находятся в Таблице Банки России 3.0"},{"q":"Как подобрать ипотечную программу (ставку) с учётом конкретного комиссионного вознаграждения?","a":"Если нет во вкладке \"Субсидии\", то через матрицу субсидирования банка https://docs.google.com/spreadsheets/d/1BIwMWMBAB7LR9MbR5qGrIXYbq_LdFshCPz1Q_l-Mqcs/edit?gid=31258751#gid=31258751"},{"q":"Как рассчитать дисконт ?","a":"В зависимости от банка. Чаще всего дисконт считается от базовой ставки или через матрицу субсидирования https://docs.google.com/spreadsheets/d/1BIwMWMBAB7LR9MbR5qGrIXYbq_LdFshCPz1Q_l-Mqcs/edit?gid=31258751#gid=31258751"}]},{"topic":"Общие вопросы","qa":[{"q":"В каких банках доступна частичная оплата первоначального взноса/отсрочка ПВ ( первоначального взноса)?","a":"Сбер ( проведение сделки возможног только очно),  Альфа- Банк, Банк ВТБ, Совкомбанк, МКБ по индивидуальному согласованию, Абсолют Банк, Металлинвестбанк, Промсвязьбанк и другие. Смотри вкладку \"Общие условия\" в таблице Банки 3.0, столбец \"Отсрочка ПВ\""},{"q":"В каких банках возможна полностью дистанционная (онлайн) сделка по ипотеке?","a":"Сбер,  Альфа- Банк,Банк ВТБ, Совкомбанк, МКБ, Дом.РФ,  Абсолют Банк, Уралсиб Банк и другие. Смотри вкладку \"Общие условия\" в таблице Банки 3.0, столбец \"Сделка онлайн\""},{"q":"В каких банках можно включить в ДДУ мебель и отделку?","a":"В зависимости от программы, по Семейной ипотеке необходимо дополнительное соглашение на отделку. По Стандартной ипотеке возможно в ВТБ, Металлинвестбанке, АТБ, смотри вкладку  \"Общие условия\" в таблице Банки 3.0, столбец \"Мебель и ремонт в ДДУ\""},{"q":"Можно ли оформить ипотеку без первоначального взноса?","a":"Нет, но клиент может оформить потребительский кредит на первоначальный взнос и  провести сделку только в некоторых банках: Альфа-Банк, Абсолют Банк и другие."},{"q":"Как и на каком этапе оформить потребительский кредит для первоначального взноса по ипотеке?","a":"Подать заявку можно после положительного решения по ипотеке, оформляется потребительский кредит в день сделки или не ранее, чем за 2 дня до подписания кредитного договора."},{"q":"Можно ли оформить ипотеку без официального трудоустройства  или находясь в декрете?","a":"Такая возможность есть, необходима предварительная консультация ипотечного специалиста."},{"q":"Доступна ли ипотека с государственной поддержкой нерезиденту?","a":"Нет."},{"q":"Доступна ли стандартная (субсидированная застройщиком) ипотека нерезиденту?","a":"Да, доступна, ВТБ, Сбербанк."},{"q":"Можно ли выделить долю ребёнку при покупке новой квартиры в ипотеку, если сделка согласована с органами опеки?","a":"Да, можно."},{"q":"Какой максимальный возраст  клиента должен быть  на момент погашения ипотеки?","a":"В зависимости от банка, 70-75 лет."}]},{"topic":"IT ипотека","qa":[{"q":"Как проверить, подходит ли организация под условия IT ипотеки ?","a":"Компанию можно на портале Госуслуг - в реестре аккредитованных ИТ-компаний Минцифры, по названию или ИНН работодателя, так же,  компания должна получать налоговые льготы  Также, компания должна быть зарегистрирована на территории РФ, кроме Москвы и Санкт-Петербурга — сотрудники таких компаний в программу не попадают."},{"q":"Какой минимальный доход должен быть у клиента для участия в программе IT ипотеки?","a":"Среднемесячный доход до вычета НДФЛ за последние 3 месяца: от 150 000 руб если работодатель зарегистрирован в городе-миллионнике, Московской или Ленинградской области (кроме Москвы и СПб);\n от 90 000 ₽ - для остальных регионов. Учитывается не место проживания заёмщика, а юридический адрес компании: удалёнщик из Тюмени, работающий на компанию из Новосибирска, обязан показать 150 000 ₽. В доход можно включить и совместительство, если вторая компания тоже аккредитована"},{"q":"Можно ли привлечь в созаёмщики человека, который не соответствует условиям IT ипотеки?","a":"Да, льготный статус достаточно подтвердить основному заемщику, а доходы остальных созаёмщиков учитываются при расчёте суммы кредита. Созаёмщиком может быть официальный супруг, совершеннолетний член семьи или третье лицо."},{"q":"Какой минимальный стаж на текущем месте работы требуется для оформления IT ипотеки?","a":"Минимум 3 месяца непрерывной работы в аккредитованной ИТ-компании на момент подачи заявки (общий трудовой стаж - не менее 1 года в большинстве банков)."},{"q":"Сохраняется ли право на оформление IT ипотеки в будущем, если оба супруга подходят под её условия и уже участвуют в действующем кредитном договоре?","a":"Если действующий кредитный договор  - это льготная ипотека (в том числе ИТ, семейная, дальневосточная и любая другая с господдержкой), заключённая после 23.12.2023, то право на новую ИТ-ипотеку уже израсходовано: считается, что каждый участник договора (и заемщик, и созаёмщик) уже воспользовался госпрограммой, второй раз её не дадут. Если же оба супруга участвуют в обычном рыночном кредитном договоре, право на ИТ-ипотеку сохраняется."},{"q":"Возможно ли подтвердить доход справкой по форме банка?","a":"Да, есть банки, которые принимают справку по форме банка, например Дом.РФ"},{"q":"Как часто и на протяжении какого срока нужно подтверждать право на льготную ставку по IT ипотеке?","a":"Трудоустройство в аккредитованной ИТ-компании подтверждается каждые 6 месяцев. Подтверждать нужно в течение всего срока кредита. Банк отслеживает и работодателя: при утрате компанией аккредитации или налоговых льгот заёмщику даётся 6 месяцев на переход в новую подходящую компанию."},{"q":"Каков максимальный возраст заёмщика по IT ипотеке?","a":"До 50 лет включительно на дату оформления кредита. Дополнительно банки учитывают возраст на дату полного погашения 70-75 лет в зависимости от банка."},{"q":"Можно ли рефинансировать стандартную (рыночную) ипотеку в  IT ипотеку?","a":"На ИТ делать рефинансирование нельзя."},{"q":"Можно ли перейти с рассрочки на IT ипотеку?","a":"Да, возможно."},{"q":"Что произойдёт с ипотекой, если заёмщик уволится из аккредитованной ИТ-компании?","a":"У заёмщика есть 6 месяцев на трудоустройство в новую ИТ-компанию, соответствующую условиям ИТ ипотеки. Сменять работодателя можно неограниченно. Если за полгода подходящую работу найти не удалось, ставка пересчитывается: ключевая ставка ЦБ на дату заключения кредитного договора + 2,5%."},{"q":"Можно ли использовать материнский капитал в качестве первоначального взноса по IT ипотеке?","a":"Да. Материнский капитал принимается в первоначальный взнос или на погашение уже выданного кредита."},{"q":"Можно ли оформить IT ипотеку, если клиент (или супруг) уже был участником ИТ-ипотеки или любой другой госпрограммы после 23.12.2023, а затем вышел из программы (погасил кредит)?","a":"В случае, если клиент был участником ИТ-ипотеки оформить новую ИТ-ипотеку нельзя. Семейной  программой воспользоваться возможно, при условии рождения ребенка после даты заключения кредитного договора по ИТ-ипотеке."}]},{"topic":"Военная ипотека","qa":[{"q":"В каких банках можно оформить военную ипотеку или семейную военную ипотеку?","a":"Сбер, Банк ВТБ, Промсвязьбанк и Банк Россия. Семейную можно оформить в банках: Промсвязьбанк и Банк Россия"},{"q":"Может ли заёмщик дополнить первоначальный взнос собственными денежными средствами?","a":"Да."},{"q":"Можно ли использовать материнский капитал в составе первоначального взноса?","a":"Да."},{"q":"Как скачать свидетельство (документы) НИС?","a":"На официальном сайте Росвоенипотека — в разделе «Для участников НИС» с помощью последних 10 цифр 20-значного регистрационного номера участника НИС и даты рождения."},{"q":"Можно ли оформить жильё в общую долевую собственность с официальным супругом/супругой?","a":"Нет. Супруг/супруга исключается нотариальным согласием."},{"q":"Можно ли исключить супруга из сделки, и не теряет ли он/она свои права при военной ипотеке?","a":"Исключить возможно, право не теряет, при наличии сертификата НИС."},{"q":"Какова максимальная сумма кредита?","a":"В зависимости от банка, программы, возраста. По Стандратной программе до 2 448 000 рублей, по Семейной программе- 5 365 000 рублей."},{"q":"Можно ли субсидировать военную ипотеку (снизить ставку)?","a":"Нет. Субсидировать военную ипотеку нельзя."},{"q":"Можно ли рефинансировать стандартную (гражданскую) ипотеку в военную?","a":"Нет. Рефинансировать стандартную ипотеку на военную нельзя."},{"q":"Можно ли перейти с рассрочки застройщика на военную ипотеку?","a":"Нет."},{"q":"Каков максимальный срок кредита по военной ипотеке?","a":"Срок кредита устанавливается в сертификате НИС."}]}], STEPS=[["Шаг 1. Проверь сделку перед передачей брокеру","Имя клиента; контактный номер и с кем связываться; итоговая стоимость квартиры и применённые скидки; ипотечная программа; срок и ставка при субсидировании; первоначальный взнос; предпочтения по банку; краткие заметки о ситуации клиента."],["Шаг 2. Переведи сделку","Переведи сделку на этап «Подать на ипотеку» через кнопку «Брокер без брони»."],["Шаг 3. Создай чат при необходимости","При необходимости создай чат с клиентом и всеми участниками сделки."],["Шаг 4. Следи за статусом","Ипотечный брокер свяжется с клиентом в день передачи. Если нужно связаться в определённое время — укажи это в задаче. На этапе сбора документов может потребоваться помощь менеджера. Решения банков брокер вносит в AMP CRM во вкладку «Ипотека подана»."],["Шаг 5. Одобрено — передай в оформление","Свяжись с клиентом, согласуй параметры сделки, проверь размер и дату первоначального взноса, особенности выделения долей и срок выхода на сделку. После согласования передай сделку в отдел оформления."]], CALCS=[["Семейная ипотека","https://strana-ipoteka.github.io/strana-semeynaia-ipoteka.github.io/"],["Базовый калькулятор","https://docs.google.com/spreadsheets/d/1GcQEbyyR52jR16CqFiKjHX3mvBd-YCTPlKe2QQXiUlU/edit?gid=1424402132"],["Ипотека траншами (Домклик)","https://domclick.ru/ipoteka/calculator?from=topline2020"]], INSURERS=["АО «ГСК „Югория“»","СОГАЗ","АльфаСтрахование","Зетта Страхование","ВСК","Росгосстрах","Абсолют Страхование","РЕСО-Гарантия","Полис Онлайн","Fast Эстейт"], RISKS=["Жизнь и здоровье заёмщика","Несчастные случаи","Страхование квартиры","ОСАГО","КАСКО","Страхование от беспилотников","Антиклещ","Страхование выезжающих за рубеж","Страхование залогового объекта","Продление страховых полисов"];
const app=document.getElementById('app');let query='',filter='Все темы';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s&]+)/g,s=>'<a class="link" href="'+s+'" target="_blank" rel="noopener noreferrer">'+s+'</a>')}
function home(){
app.innerHTML='<h1>База знаний отдела ипотеки</h1><p class="lead">Материалы, инструкции и ответы на вопросы для менеджеров отдела продаж.</p><div class="rule"></div><label for="main-search" class="tag">Поиск по разделам и материалам</label><input id="main-search" class="main-search" type="search" placeholder="Например: калькулятор, страхование, семейная ипотека…" aria-label="Поиск по разделам и материалам"><p class="search-meta" id="main-search-count" aria-live="polite"></p><div class="grid" id="section-grid"></div>';
const input=document.getElementById('main-search');input.value=homeQuery;input.addEventListener('input',e=>{homeQuery=e.target.value;renderSections()});renderSections();
}
let homeQuery='';
function renderSections(){
const term=homeQuery.trim().toLocaleLowerCase('ru');
const matchingFaq=term&&FAQ.some(t=>t.topic.toLocaleLowerCase('ru').includes(term)||t.qa.some(x=>(x.q+' '+x.a).toLocaleLowerCase('ru').includes(term)));
const items=SECTIONS.filter(s=>!term||(s.title+' '+s.desc).toLocaleLowerCase('ru').includes(term)||(s.id==='faq'&&matchingFaq));
document.getElementById('main-search-count').textContent=term?'Найдено разделов: '+items.length:'Все разделы: '+SECTIONS.length;
document.getElementById('section-grid').innerHTML=items.length?items.map(s=>s.pending?'<div class="card off"><b>'+esc(s.title)+'</b><small>'+esc(s.desc)+'</small><span class="pill">В подготовке</span></div>':'<a class="card" href="'+(s.internal?'#'+s.id:esc(s.url))+'"'+(s.internal?'':' target="_blank" rel="noopener noreferrer"')+'><b>'+esc(s.title)+'</b><small>'+esc(s.desc)+'</small></a>').join(''):'<div class="empty">По вашему запросу ничего не найдено. Попробуйте другое слово.</div>';
}
function layout(title,body){app.innerHTML='<a class="back" href="#home">← Назад к разделам</a><p class="crumbs">Отдел ипотеки / '+esc(title)+'</p><h1>'+esc(title)+'</h1><div class="rule"></div>'+body}
function faq(){layout('Часто задаваемые вопросы','<p class="lead">73 вопроса по 7 темам. Найдите ответ по ключевым словам или выберите тему.</p><div class="notice">Ответы перенесены из рабочей таблицы. Банковские условия и законодательные требования необходимо сверять с актуальными первоисточниками перед применением.</div><div class="tools"><input id="search" type="search" placeholder="Поиск по вопросам и ответам…" aria-label="Поиск"><select id="topic" aria-label="Выберите тему"><option>Все темы</option>'+FAQ.map(s=>'<option>'+esc(s.topic)+'</option>').join('')+'</select></div><p id="matches" class="muted"></p><div id="results"></div>');document.getElementById('search').value=query;document.getElementById('topic').value=filter;document.getElementById('search').oninput=e=>{query=e.target.value;renderFaq()};document.getElementById('topic').onchange=e=>{filter=e.target.value;renderFaq()};renderFaq()}
function renderFaq(){const n=query.toLocaleLowerCase('ru').trim(),entries=FAQ.flatMap(t=>t.qa.map(item=>({...item,topic:t.topic}))).filter(q=>(filter==='Все темы'||q.topic===filter)&&(!n||(q.q+' '+q.a+' '+q.topic).toLocaleLowerCase('ru').includes(n)));document.getElementById('matches').textContent='Найдено вопросов: '+entries.length;document.getElementById('results').innerHTML=entries.length?entries.map((q,i)=>'<details class="panel qa"><summary><span class="tag">'+esc(q.topic)+'</span>'+esc(q.q)+'</summary><div class="answer">'+linkify(q.a)+'<div><button type="button" data-copy="'+i+'">Скопировать ответ</button></div></div></details>').join(''):'<div class="empty">По вашему запросу ничего не найдено</div>';document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const item=entries[Number(b.dataset.copy)];navigator.clipboard?.writeText(item.q+'\n'+item.a).then(()=>{b.textContent='Скопировано';},()=>{b.textContent='Не удалось скопировать'});});}
function navigatorPage(){layout('Ипотечный навигатор','<p class="lead">От менеджера продаж к ипотечному брокеру — пошаговый маршрут.</p>'+STEPS.map((x,i)=>'<section class="panel"><h2>'+esc(x[0])+'</h2><p>'+esc(x[1])+'</p></section>').join(''))}
function calculators(){layout('Калькуляторы','<p class="lead">Инструменты для предварительного расчёта ипотеки.</p><div class="grid">'+CALCS.map(x=>'<a class="card" href="'+esc(x[1])+'" target="_blank" rel="noopener noreferrer"><b>'+esc(x[0])+'</b><small>Открыть калькулятор ↗</small></a>').join('')+'<div class="card off"><b>Комбо-ипотека</b><small>В исходной таблице указана папка Google без ссылки</small><span class="pill">В подготовке</span></div></div>')}
function insurance(){layout('Страхование','<div class="grid"><section class="panel"><h2>Страховые партнёры</h2>'+INSURERS.map(x=>'<p>• '+esc(x)+'</p>').join('')+'</section><section class="panel"><h2>Страховые продукты</h2>'+RISKS.map(x=>'<p>• '+esc(x)+'</p>').join('')+'</section></div><div class="notice">Для оформления или продления полиса обратитесь к ипотечному брокеру. Контакт: broker@strana.com. Списки партнёров и продуктов не являются попарным соответствием.</div>')}
function team(){layout('Структура отдела','<p class="lead">Отдел работает по направлениям «Восток» и «Запад».</p><div class="notice">Контакты и ФИО сотрудников из рабочей таблицы не опубликованы на общедоступном сайте. Для внутреннего справочника понадобится согласованный способ ограничить доступ.</div><div class="grid"><div class="panel"><h2>Восток</h2><p>Руководитель отдела</p><p>Ведущий ипотечный брокер</p><p>Ипотечные брокеры региона</p></div><div class="panel"><h2>Запад</h2><p>Руководитель отдела</p><p>Ведущий ипотечный брокер</p><p>Ипотечные брокеры региона</p></div></div>')}
function route(){const id=decodeURIComponent(location.hash.slice(1)||'home');if(id==='home')home();else if(id==='faq')faq();else if(id==='navigator')navigatorPage();else if(id==='calculators')calculators();else if(id==='insurance')insurance();else if(id==='team')team();else home();window.scrollTo(0,0);}
document.getElementById('theme').onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',dark?'light':'dark')};window.addEventListener('hashchange',route);route();
</script></body></html>
