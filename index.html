<!doctype html><html lang="ru"><head><link rel="icon" type="image/png" href="https://mikhailshevelev-dotcom.github.io/UOiI/favicon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#29303E"><title>Отдел ипотеки — База знаний</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="./site-theme.js?v=5"></script>
<style>
:root{--graphite:#29303E;--purple:#951B81;--grad:linear-gradient(90deg,#831F82 0%,#C7017F 60%,#E30613 100%);--bg:#F4F5F9;--surface:#fff;--text:#29303E;--muted:#6A7080;--line:#DFE2EA;--tile:#29303E;--tile-text:#fff;--accent:#951B81;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1B2029;--surface:#252B38;--text:#F1F2F6;--muted:#AEB5C4;--line:#3A4252;--tile:#30394A;--accent:#E04DC4;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1B2029;--surface:#252B38;--text:#F1F2F6;--muted:#AEB5C4;--line:#3A4252;--tile:#30394A;--accent:#E04DC4;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Montserrat,'Segoe UI',Arial,sans-serif}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
header{background:#fff;border-bottom:1px solid #E5E7EE;position:sticky;top:0;z-index:5}.bar{max-width:1040px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}.logo{max-width:280px;width:100%;height:26px;object-fit:contain;object-position:left}.nav{display:flex;align-items:center;gap:12px}.nav a,.nav button{font:600 14px Montserrat,sans-serif;padding:9px 12px;border:0;border-radius:10px;background:transparent;color:#29303E;cursor:pointer}.nav a:hover,.nav button:hover{background:#F6EAF4;color:#951B81}.stripe{height:4px;background:var(--grad)}main{max-width:1040px;margin:auto;padding:36px 20px 64px;min-height:72vh}h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:0 0 12px}h2{font-size:23px;margin:0 0 16px}h3{margin:0 0 10px;font-size:17px}.lead{font-size:18px;color:var(--muted);margin:0 0 24px}.rule{height:6px;width:120px;border-radius:8px;background:var(--grad);margin:24px 0 30px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;gap:9px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--purple);border-radius:14px;padding:20px 18px;min-height:120px;overflow-wrap:anywhere}.card b{font-size:16px;line-height:1.35;letter-spacing:-.02em}.card small{font-size:12px;line-height:1.55}.card:hover:not(.off){box-shadow:0 8px 22px #0002;border-color:var(--accent)}.card small{color:var(--muted)}.card.off{border-left-color:var(--line);opacity:.68;border-style:dashed}.back{display:inline-block;padding:10px 18px;background:var(--tile);color:white;border-radius:10px;font-weight:600;margin-bottom:25px}.crumbs{font-size:13px;color:var(--muted);margin-bottom:16px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:15px}.panel p{margin:0 0 10px;white-space:pre-line}.panel p:last-child{margin-bottom:0}.muted{color:var(--muted)}.notice{border-left:4px solid var(--purple);padding:12px 16px;background:var(--surface);border-radius:8px;margin:0 0 20px;color:var(--muted);font-size:13px}.tools{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}.tools input,.tools select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:44px}.tools input{flex:2;min-width:225px}.tools select{flex:1;min-width:180px}.qa{margin-bottom:12px}.qa summary{cursor:pointer;font-weight:600;padding:16px 18px}.qa .answer{padding:0 18px 18px;white-space:pre-line;line-height:1.7}.qa button{margin:12px 0 0;background:var(--tile);border:0;color:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}.tag{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:5px}.pill{display:inline-block;padding:5px 9px;background:var(--bg);border-radius:30px;color:var(--muted);font-size:12px}.link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}.empty{padding:25px;text-align:center;color:var(--muted)}.main-search{width:100%;max-width:620px;font:inherit;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--surface);color:var(--text);margin:0 0 10px}.search-meta{color:var(--muted);font-size:13px;margin:0 0 22px}.card.off .pill{align-self:flex-start;margin-top:auto}.card.off{min-height:120px}footer{max-width:1040px;margin:auto;padding:0 20px 34px;color:var(--muted);font-size:13px}@media(min-width:671px) and (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:670px){.bar{flex-direction:column;align-items:flex-start}.nav{width:100%;justify-content:space-between}.nav a,.nav button{padding:8px;font-size:12px}main{padding-top:25px}.grid{grid-template-columns:1fr}}
:root[data-theme="dark"] header{background:#252b38;border-bottom-color:#3a4252}
:root[data-theme="dark"] .nav a,:root[data-theme="dark"] .nav button{color:#f1f2f6}
:root[data-theme="dark"] .nav a:hover,:root[data-theme="dark"] .nav button:hover{background:#363043;color:#f09cdb}
:root[data-theme="dark"] .back{background:#465167;color:#fff}
:root[data-theme="light"]{--bg:#F4F5F9;--surface:#fff;--text:#29303E;--muted:#6A7080;--line:#DFE2EA;--tile:#29303E;--accent:#951B81;color-scheme:light}

/* Единый визуальный язык с разделом «Документы на ипотеку» */
:root[data-theme="light"]{--bg:#f8f6f8;--surface:#fff;--text:#261e2c;--muted:#766b79;--line:#e9e3ea;--accent:#9b287f;--purple:#9b287f}
:root[data-theme="dark"]{--bg:#1b2029;--surface:#262b36;--text:#f0edf3;--muted:#b7aab8;--line:#42404e;--accent:#e389c6;--purple:#e389c6}
body{font-family:Inter,Montserrat,"Segoe UI",Arial,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1160px;padding:18px 24px}
.logo{max-width:165px;height:22px}
.nav{gap:12px}
.nav a,.nav button{font-family:inherit;font-size:13px;font-weight:700;border-radius:11px;color:var(--text)}
.nav button#theme{color:var(--accent);background:#f6edf4;border:1px solid #e5d0df;padding:10px 14px}
.nav a:hover,.nav button:hover{background:#f9edf6;color:#9b287f}
:root[data-theme="dark"] .nav button#theme{background:#35283a;border-color:#5b3e57;color:#efb1dd}
:root[data-theme="dark"] header{background:#262b36;border-color:var(--line)}
main{max-width:1160px;padding:34px 24px 70px}
h1{font-size:clamp(29px,4vw,48px);line-height:1.08;letter-spacing:-.035em}
h2{letter-spacing:-.025em}
.card,.panel{border:1px solid var(--line);border-radius:21px;background:var(--surface);box-shadow:0 7px 28px #31123508}
.card{border-left:4px solid var(--accent);padding:22px;transition:border-color .15s,box-shadow .15s}
.card:hover:not(.off){border-color:var(--accent);box-shadow:0 18px 45px #31123513}
.back{border-radius:12px;background:#f3eef3;color:#5d4760}
.tools input,.tools select,.main-search{border-radius:12px}
:root[data-theme="dark"] .nav a,:root[data-theme="dark"] .nav button{color:#f0edf3}
:root[data-theme="dark"] .nav button#theme{color:#efb1dd}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .panel{box-shadow:none}
@media(max-width:670px){.bar{padding:14px}.nav{flex-wrap:wrap}.nav a,.nav button{padding:8px 10px}main{padding:22px 14px 45px}}


/* Внутренние HTML-разделы отображаются внутри базы знаний по адресу /#раздел. */
.embedded-section{width:100%;min-width:0}
.embedded-nav{display:flex;align-items:center;margin-bottom:18px}
.embedded-frame{display:block;width:100%;min-height:480px;height:640px;border:0;background:transparent;overflow:hidden}
@media(max-width:670px){.embedded-nav{margin-bottom:10px}}

/* FAQ — структура карточек и раскрывающихся вопросов как у отдела оформления */
.faq-page{max-width:1040px;margin:0 auto}
.faq-page .lead{max-width:760px;margin-bottom:18px}
.faq-page .rule{margin-bottom:22px}
.faq-search{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:14px}
.faq-search:focus-within{border-color:var(--accent)}
.faq-search-icon{font-size:25px;color:var(--muted);line-height:1}
.faq-search input{width:100%;flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:500 15px Montserrat,Arial,sans-serif;padding:15px 0;outline:0}
.faq-search button{background:var(--bg);border:0;border-radius:8px;color:var(--accent);font-size:20px;width:30px;height:30px;cursor:pointer}
.faq-search button[hidden]{display:none}
.faq-count{color:var(--muted);font-size:13px;margin:0 0 14px}
.faq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-bottom:20px}
.faq-grid[hidden],.faq-search-results[hidden]{display:none}
.faq-category{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:10px;min-height:112px;padding:22px 44px 20px 23px;border:1px solid var(--line);border-left:5px solid var(--purple);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.faq-category:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(41,48,62,.15)}
.faq-category-title{font-size:17px;line-height:1.35;font-weight:700}
.faq-category-meta{font-size:13px;color:var(--muted)}
.faq-category-arrow{position:absolute;right:18px;top:38px;color:var(--accent);font-size:28px}
.faq-topic-back{display:inline-flex;align-items:center;color:var(--accent);font-weight:700;font-size:14px;text-decoration:none;margin:8px 0 14px}
.faq-topic-back:hover{text-decoration:underline}
.faq-breadcrumb{font-size:13px;color:var(--muted);margin:0 0 8px}
.faq-topic-heading{font-size:clamp(22px,3vw,30px);margin:0 0 20px;line-height:1.2}
.faq-topic-heading:after{content:"";display:block;width:90px;height:5px;border-radius:3px;background:var(--grad);margin-top:12px}
.faq-band{background:var(--tile);color:#fff;border-radius:9px 9px 0 0;padding:14px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq-band span:last-child{font-size:12px;font-weight:500;opacity:.8}
.faq-list{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px;padding:5px 14px 14px;margin-bottom:20px}
.faq-question{border-bottom:1px solid var(--line)}
.faq-question:last-child{border-bottom:0}
.faq-question summary{list-style:none;position:relative;cursor:pointer;font-size:15px;font-weight:600;line-height:1.5;padding:15px 32px 15px 5px}
.faq-question summary::-webkit-details-marker{display:none}
.faq-question summary:after{content:"+";position:absolute;right:7px;top:12px;font-size:22px;color:var(--accent);font-weight:500}
.faq-question[open] summary:after{content:"−"}
.faq-question[open] summary{color:var(--accent)}
.faq-answer{padding:0 5px 17px}
.faq-answer-text{background:rgba(149,27,129,.07);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 16px;white-space:pre-line;line-height:1.7;color:var(--text)}
.faq-copy{margin-top:10px;padding:8px 14px;border:0;border-radius:999px;background:var(--tile);color:#fff;font:600 13px Montserrat,Arial,sans-serif;cursor:pointer}
.faq-search-results{margin-bottom:24px}
.faq-search-group{background:var(--surface);border:1px solid var(--line);border-radius:9px;margin-bottom:10px;padding:12px 16px}
.faq-result-topic{display:block;font-size:12px;color:var(--accent);font-weight:700;margin:0 0 4px}
.faq-disclaimer{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--muted);font-size:13px}
:root[data-theme="dark"] .faq-answer-text{background:rgba(224,77,196,.12)}
@media(max-width:670px){.faq-grid{grid-template-columns:1fr}.faq-category{padding:17px 40px 17px 16px;min-height:92px}.faq-category-title{font-size:15px}.faq-band{padding:12px 14px}.faq-list{padding:4px 10px 12px}}

/* Справочник сотрудников в стиле «Структуры отдела» УОиИ. */
.team-directory{max-width:1040px;margin:0 auto}
.team-directory .lead{max-width:760px;margin-bottom:18px}
.team-directory .rule{margin-bottom:22px}
.team-search{position:relative;display:block;margin:0 0 20px}
.team-search input{display:block;width:100%;min-height:54px;padding:13px 18px 13px 48px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);outline:0;font:500 15px Montserrat,Arial,sans-serif}
.team-search input:focus{border-color:var(--accent)}
.team-search-icon{position:absolute;top:50%;left:16px;transform:translateY(-50%);font-size:26px;line-height:1;color:var(--accent);pointer-events:none}
.team-directions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.team-direction{min-height:160px;padding:23px 22px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;gap:10px;background:var(--grad);color:#fff;border:0;border-radius:18px;box-shadow:0 8px 20px rgba(149,27,129,.17);font-family:inherit;cursor:pointer}
.team-direction:nth-child(2){background:var(--graphite);box-shadow:0 8px 20px rgba(41,48,62,.18)}
.team-direction strong{font-size:27px;font-weight:700}
.team-direction span{font-size:14px}
.team-direction .team-direction-arrow{align-self:flex-end;font-size:24px;line-height:1}
.team-direction:hover{filter:brightness(1.08)}
.team-back{display:block;width:100%;margin:0 0 16px;border:2px solid var(--accent);border-radius:14px;background:var(--surface);color:var(--accent);font:700 14px Montserrat,Arial,sans-serif;padding:12px 18px;cursor:pointer}
.team-region-head{border-radius:16px;background:var(--grad);color:#fff;padding:18px 20px;margin-bottom:18px}
.team-region-head h2{margin:0 0 4px;font-size:25px}
.team-region-head p{margin:0;font-size:13px}
.team-person-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.team-person{display:flex;gap:20px;align-items:center;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:170px}
.team-avatar{display:grid;place-items:center;flex:0 0 88px;width:88px;height:88px;border-radius:50%;background:var(--bg);color:var(--accent);border:1px solid var(--line);font-weight:700;font-size:24px}
.team-person-content{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.team-person-content strong{font-size:18px;line-height:1.3;color:var(--text)}
.team-person-region{font-size:12px;color:var(--muted)}
.team-mis{display:inline-flex;align-items:center;margin-top:8px;padding:7px 12px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);text-decoration:none;font-size:12px;font-weight:700}
.team-mis:hover{background:var(--accent);color:#fff}
.team-results-count{font-size:13px;color:var(--muted);margin:0 0 14px}
@media(max-width:700px){.team-person-list{grid-template-columns:1fr}}
@media(max-width:480px){.team-directions{grid-template-columns:1fr}.team-direction{min-height:130px}.team-person{min-height:140px;padding:16px;gap:14px}.team-avatar{width:72px;height:72px;flex-basis:72px;font-size:19px}.team-person-content strong{font-size:16px}}
.team-avatar-photo{display:block;object-fit:cover;object-position:center;border-radius:50%;overflow:hidden;background:var(--surface);padding:0;aspect-ratio:1 / 1}

const SECTIONS=[{"id":"banks-memo","title":"Памятка «Банки России 3.0»","desc":"Информация по ипотечным программам","url":"./memo-original.html"},{"id":"banks-table","title":"Таблица «Банки 3.0»","desc":"Условия банков и программы","url":"https://docs.google.com/spreadsheets/d/1BIwMWMBAB7LR9MbR5qGrIXYbq_LdFshCPz1Q_l-Mqcs/edit?gid=1749938485"},{"id":"credit-history","title":"Проверка кредитной истории","desc":"Пошаговая памятка ОКБ: просмотр и скачивание PDF","url":"./credit-history.html"},{"id":"documents","title":"Документы на ипотеку","desc":"Интерактивный подбор и список документов для клиента","url":"./documents.html"},{"id":"navigator","title":"Ипотечный навигатор","desc":"От менеджера продаж к ипотечному брокеру","internal":true},{"id":"competitors","title":"Анализ конкурентов","desc":"Открыть таблицу анализа конкурентов","url":"https://docs.google.com/spreadsheets/d/11T6bpmjhUY96OkTpJyrE-yXnJLclYooKeiyVej6A37Q/edit?gid=1709744959#gid=1709744959"},{"id":"training","title":"Видеообучение по таблице «Банки 3.0»","desc":"Перейти к обучению в Teamly","url":"https://teamly.itstrana.site/at/f6fdba77-2cfa-42eb-a850-1218e8419c1d"},{"id":"calculators","title":"Калькуляторы","desc":"Семейная, комбо и базовый расчёт","internal":true},{"id":"team","title":"Структура отдела","desc":"Региональная структура, без публикации личных контактов","internal":true},{"id":"insurance","title":"Страхование","desc":"Партнёры и виды страхования","internal":true},{"id":"faq","title":"Часто задаваемые вопросы","desc":"73 вопроса по 7 темам","internal":true},{"id":"channel","title":"Знай больше — продавай увереннее!","desc":"Перейти в канал MAX","url":"https://max.ru/join/35RDmRC54NNG9cuzr5uoJyifUYFU4JCH6BPq4-tdSv4"}], FAQ=[{"topic":"Ипотека траншами","qa":[{"q":"Возможно ли частичное досрочное погашение (ЧДП) или полное досрочное погашение кредита по ипотеке траншами?","a":"Пока действует первый транш, по досрочному гашению можно сокращать только ежемесячный платёж, срок нельзя. Сокращать срок можно только в том случае, когда переведён последний транш клиенту"},{"q":"Можно ли перейти с траншевой ипотеки на программу с господдержкой (например, семейную ипотеку) через рефинансирование?","a":"Да, можно, в случае, если выданы все транши"},{"q":"Можно ли использовать субсидии (материнский капитал, региональные выплаты) для погашения ипотеки траншами?","a":"Да, возможно. При направлении средств МСК в частичное досрочное погашение необходимо учесть, что транш после поступления средств МСК не должен быть погашен полностью. Если получены не все транши, то с сокращением платежа, если получены все транши, с сокращением срока"},{"q":"В какие сроки и на каких условиях допускается расторжение кредитного договора?","a":"После полного погашения первого транша, если не выдан второй транш. Если выданы все транши, то только после погашения всей суммы кредита"},{"q":"Какое максимальное количество траншей предусмотрено?","a":"5 траншей"},{"q":"Какой максимальный срок, в течение которого должны быть выданы все транши?","a":"Если транши по ДКП: максимальный срок 2 года, если транши по ДДУ: максимальный срок 3 года, НО до ввода дома в эксплуатацию"},{"q":"Как получить следующий транш — что для этого нужно?","a":"В настоящее время транши Сбербанком перечисляются автоматически, если автоматического зачисления не произошло, клиенту необходимо обратиться в Домклик, или в любой офис Сбербанка"},{"q":"Минимальная сумма первого транша?","a":"Не менее 100 000 рублей"}]},{"topic":"Семейная ипотека","qa":[{"q":"Можно ли исключить супруга из состава участников сделки (из заявки, кредитного договора, ДДУ)?","a":"Нет. С 1 февраля 2026 года супруги по семейной ипотеке — обязательные созаёмщики, брачным договором исключить их из сделки нельзя. Исключения: супруг — иностранный гражданин, либо участник накопительно-ипотечной системы (военная ипотека). По ранее оформленным кредитам вывод супруга возможен только с согласия банка через брачный договор, соглашение о разделе имущества или развод."},{"q":"Требуется ли прописка детей?","a":"Нет. С 1 октября 2026 года отменено требование предоставления постоянной регистрации ребёнка по месту жительства."},{"q":"При каких условиях допускается оформление второй семейной ипотеки?","a":"Когда будет закрыта предыдущая семейная ипотека и рождён ещё один ребёнок."},{"q":"Возможно ли оформить семейную ипотеку, если клиент (или супруг/супруга) ранее участвовал в льготной ипотечной программе после 23.12.2023, а затем вышел из числа участников?","a":"Нет. Так как после 23.12.2023 года возможно оформить только одну льготную программу в «одни руки». А с 01.02.2026 года оба супруга, если они в официальном браке, должны участвовать в кредитном договоре. Даже если он вышел из состава участников, право на семейную ипотеку он использовал"},{"q":"Каков порядок оформления семейной ипотеки, если родители ребёнка не состоят в браке либо находятся в разводе?","a":"Первый из родителей, кто оформляет семейную ипотеку, лишает право второго родителя. Второй родитель не может оформить семейную ипотеку."},{"q":"Как учитываются дети от предыдущих браков при оформлении семейной ипотеки?","a":"Учитываются дети основного заёмщика"},{"q":"По какому принципу учитывается количество детей для определения условий семейной ипотеки (ставки, лимитов)?","a":"Учитываются дети основного заёмщика"},{"q":"Кто из участников сделки обязан подтверждать регистрацию по месту жительства, и на каком этапе это требуется?","a":"Регистрацию обязан подтверждать основной заемщик, после получения права собственности, в течение 5 лет"},{"q":"Допускается ли рефинансирование семейной ипотеки в другом банке?","a":"Да, допускается, в зависимости от банка."},{"q":"Какой размер процентной ставки будет применяться с 16‑го года кредита по семейной ипотеке?","a":"По истечении 15 лет размер льготной процентной ставки будет изменён и установлен как минимальное из значений: \n- Процентная ставка на дату заключения кредитного договора, увеличенная на 4 п. п.\n- Или ключевая ставка ЦБ РФ, действующая на первое число месяца, в котором истек срок 15 лет, увеличенная на 3 п. п."},{"q":"Предусмотрена ли возможность снижения процентной ставки по семейной ипотеке после рождения ещё одного ребёнка?","a":"Да."},{"q":"Какие условия необходимо выполнить, чтобы получить льготную ставку 6 % по семейной ипотеке?","a":"Ставка 6 % по Семейной ипотеке будет при одном из условий:\n1. Есть трое детей, одному из которых до 7 лет\n2. Первоначальный взнос от 50,1 %\n3. Есть ребёнок-инвалид, которому до 18 лет"},{"q":"Как рассчитать субсидированную ставку по Семейной ипотеке, если клиент подходит под ставку 6% (ребёнок-инвалид или ПВ 50 %)?","a":"Считаем дисконт от ставки 6% во вкладке «Субсидии Семейная ипотека» в таблице Банки России 3.0."},{"q":"Можно ли увеличить срок кредита с 15 до 30 лет посредством рефинансирования в другом банке?","a":"Возможно, в зависимости от банка."},{"q":"Допустимо ли с помощью брачного договора исключить одного из супругов из ДДУ, если супруги находятся на стадии развода, и как это повлияет на раздел залоговой квартиры?","a":"Допустимо, если процесс ещё не завершён, раздела не будет"},{"q":"Возможен ли переход с рассрочки (по ДКП) на семейную ипотеку?","a":"Невозможен. Даже при расторжении, если было ДКП перейти на Семейную ипотеку нельзя, так как в ЕГРН предыдущий собственник уже физическое лицо"},{"q":"Допускается ли оформление семейной ипотеки на срок 30 лет?","a":"Да."},{"q":"Как влияет факт банкротства супруга (в том числе при отсутствии у него дохода) на возможность одобрения семейной ипотеки?","a":"Отрицательно."}]},{"topic":"Плохая КИ/Банкроты/Закредитованность","qa":[{"q":"Оформление сделки при плохой кредитной истории, банкротстве и высокой кредитной нагрузке.","a":"При банкротстве оформление льготной (семейная и ИТ-ипотека) ипотеки невозможно, по Стандартной программе возможно, по истечении 5 лет. Необходимо проанализировать кредитный отчет и исправить кредитную историю, снизить кредитную нагрузку."},{"q":"Возможно ли одобрение ипотеки, если супруг или супруга в прошлом проходили процедуру банкротства, в том числе когда банкрот выступает созаёмщиком без подтверждённого дохода?","a":"При банкротстве оформление льготной (семейная и ИТ-ипотека) ипотеки невозможно, по Стандартной программе возможно, по истечении 5 лет. По Стандартной ипотеке возможно исключить банкрота из сделки."},{"q":"По истечении какого срока после завершения процедуры банкротства банк готов одобрить ипотечный кредит?","a":"По истечении 5 лет по Стандартной программе. По льготной программе подача заявки недопустима."},{"q":"Какие основные рекомендации по восстановлению кредитной истории?","a":"Снизить количество кредитных продуктов, закрыть имеющиеся текущие просрочки, уменьшить лимиты по действующим кредитным картам, закрыть микрозаймы."},{"q":"Каковы шансы на одобрение кредита, если у клиента в прошлом были длительные просрочки по платежам?","a":"Если в прошлом у клиента имелись просрочки 180+, передача в коллекторские агентства или принудительные взыскания через ФССП, шансы крайне низкие."},{"q":"Какой минимальный кредитный рейтинг необходим для одобрения ипотечного кредита?","a":"Зависит от кредитного бюро: в НБКИ 600 баллов, ОКБ не менее 500 баллов."},{"q":"В течение какого периода в кредитной истории клиента обновляется информация после погашения просроченной задолженности?","a":"По закону о кредитных историях в течение 2-3 рабочих дней банк обязан передать сведения во все БКИ. (бюро кредитных историй)"},{"q":"Может ли супруг получить одобрение по кредиту, если его официальная супруга (супруг) признана банкротом?","a":"Только по Стандартной ипотеке, только исключением из сделки супруга-банкрота."},{"q":"Как влияет высокая долговая нагрузка клиента на вероятность одобрения кредита?","a":"Влияет негативно, в каждом банке свои расчётные коэффициенты. У клиента должно оставаться на руках не менее 50% от его дохода, включая расходы по действующим кредитам и платежом по заявке на текущую ипотеку."}]},{"topic":"Субсидирование","qa":[{"q":"На какой срок допустимо субсидирование процентной ставки?","a":"Субсидирование ставки возможно только на весь срок кредита"},{"q":"Как определить размер комиссионного вознаграждения?","a":"Комиссия устанавливается матрицей банка, в том числе она будет зависеть от программы, срока ипотеки, желаемой ставки. Все актуальные матрицы находятся в Таблице Банки России 3.0"},{"q":"Как подобрать ипотечную программу (ставку) с учётом конкретного комиссионного вознаграждения?","a":"Если нет во вкладке «Субсидии», то через матрицу субсидирования банка https://docs.google.com/spreadsheets/d/1BIwMWMBAB7LR9MbR5qGrIXYbq_LdFshCPz1Q_l-Mqcs/edit?gid=31258751#gid=31258751"},{"q":"Как рассчитать дисконт?","a":"В зависимости от банка. Чаще всего дисконт считается от базовой ставки или через матрицу субсидирования https://docs.google.com/spreadsheets/d/1BIwMWMBAB7LR9MbR5qGrIXYbq_LdFshCPz1Q_l-Mqcs/edit?gid=31258751#gid=31258751"}]},{"topic":"Общие вопросы","qa":[{"q":"В каких банках доступна частичная оплата первоначального взноса/отсрочка ПВ (первоначального взноса)?","a":"Сбер (проведение сделки возможно только очно), Альфа-Банк, Банк ВТБ, Совкомбанк, МКБ по индивидуальному согласованию, Абсолют Банк, Металлинвестбанк, Промсвязьбанк и другие. Смотри вкладку «Общие условия» в таблице Банки 3.0, столбец «Отсрочка ПВ»"},{"q":"В каких банках возможна полностью дистанционная (онлайн) сделка по ипотеке?","a":"Сбер, Альфа-Банк, Банк ВТБ, Совкомбанк, МКБ, Дом.РФ, Абсолют Банк, Уралсиб Банк и другие. Смотри вкладку «Общие условия» в таблице Банки 3.0, столбец «Сделка онлайн»"},{"q":"В каких банках можно включить в ДДУ мебель и отделку?","a":"В зависимости от программы, по Семейной ипотеке необходимо дополнительное соглашение на отделку. По Стандартной ипотеке возможно в ВТБ, Металлинвестбанке, АТБ, смотри вкладку «Общие условия» в таблице Банки 3.0, столбец «Мебель и ремонт в ДДУ»"},{"q":"Можно ли оформить ипотеку без первоначального взноса?","a":"Нет, но клиент может оформить потребительский кредит на первоначальный взнос и провести сделку только в некоторых банках: Альфа-Банк, Абсолют Банк и другие."},{"q":"Как и на каком этапе оформить потребительский кредит для первоначального взноса по ипотеке?","a":"Подать заявку можно после положительного решения по ипотеке, оформляется потребительский кредит в день сделки или не ранее, чем за 2 дня до подписания кредитного договора."},{"q":"Можно ли оформить ипотеку без официального трудоустройства или находясь в декрете?","a":"Такая возможность есть, необходима предварительная консультация ипотечного специалиста."},{"q":"Доступна ли ипотека с государственной поддержкой нерезиденту?","a":"Нет."},{"q":"Доступна ли стандартная (субсидированная застройщиком) ипотека нерезиденту?","a":"Да, доступна, ВТБ, Сбербанк."},{"q":"Можно ли выделить долю ребёнку при покупке новой квартиры в ипотеку, если сделка согласована с органами опеки?","a":"Да, можно."},{"q":"Какой максимальный возраст клиента должен быть на момент погашения ипотеки?","a":"В зависимости от банка, 70-75 лет."}]},{"topic":"IT-ипотека","qa":[{"q":"Как проверить, подходит ли организация под условия IT-ипотеки?","a":"Компанию можно проверить на портале Госуслуг — в реестре аккредитованных ИТ-компаний Минцифры, по названию или ИНН работодателя, также компания должна получать налоговые льготы. Также компания должна быть зарегистрирована на территории РФ, кроме Москвы и Санкт-Петербурга — сотрудники таких компаний в программу не попадают."},{"q":"Какой минимальный доход должен быть у клиента для участия в программе IT-ипотеки?","a":"Среднемесячный доход до вычета НДФЛ за последние 3 месяца: от 150 000 руб если работодатель зарегистрирован в городе-миллионнике, Московской или Ленинградской области (кроме Москвы и СПб);\n от 90 000 ₽ - для остальных регионов. Учитывается не место проживания заёмщика, а юридический адрес компании: удалёнщик из Тюмени, работающий на компанию из Новосибирска, обязан показать 150 000 ₽. В доход можно включить и совместительство, если вторая компания тоже аккредитована"},{"q":"Можно ли привлечь в созаёмщики человека, который не соответствует условиям IT-ипотеки?","a":"Да, льготный статус достаточно подтвердить основному заемщику, а доходы остальных созаёмщиков учитываются при расчёте суммы кредита. Созаёмщиком может быть официальный супруг, совершеннолетний член семьи или третье лицо."},{"q":"Какой минимальный стаж на текущем месте работы требуется для оформления IT-ипотеки?","a":"Минимум 3 месяца непрерывной работы в аккредитованной ИТ-компании на момент подачи заявки (общий трудовой стаж - не менее 1 года в большинстве банков)."},{"q":"Сохраняется ли право на оформление IT-ипотеки в будущем, если оба супруга подходят под её условия и уже участвуют в действующем кредитном договоре?","a":"Если действующий кредитный договор - это льготная ипотека (в том числе ИТ, семейная, дальневосточная и любая другая с господдержкой), заключённая после 23.12.2023, то право на новую ИТ-ипотеку уже израсходовано: считается, что каждый участник договора (и заемщик, и созаёмщик) уже воспользовался госпрограммой, второй раз её не дадут. Если же оба супруга участвуют в обычном рыночном кредитном договоре, право на ИТ-ипотеку сохраняется."},{"q":"Возможно ли подтвердить доход справкой по форме банка?","a":"Да, есть банки, которые принимают справку по форме банка, например Дом.РФ"},{"q":"Как часто и на протяжении какого срока нужно подтверждать право на льготную ставку по IT-ипотеке?","a":"Трудоустройство в аккредитованной ИТ-компании подтверждается каждые 6 месяцев. Подтверждать нужно в течение всего срока кредита. Банк отслеживает и работодателя: при утрате компанией аккредитации или налоговых льгот заёмщику даётся 6 месяцев на переход в новую подходящую компанию."},{"q":"Каков максимальный возраст заёмщика по IT-ипотеке?","a":"До 50 лет включительно на дату оформления кредита. Дополнительно банки учитывают возраст на дату полного погашения 70-75 лет в зависимости от банка."},{"q":"Можно ли рефинансировать стандартную (рыночную) ипотеку в IT-ипотеку?","a":"На ИТ делать рефинансирование нельзя."},{"q":"Можно ли перейти с рассрочки на IT-ипотеку?","a":"Да, возможно."},{"q":"Что произойдёт с ипотекой, если заёмщик уволится из аккредитованной ИТ-компании?","a":"У заёмщика есть 6 месяцев на трудоустройство в новую ИТ-компанию, соответствующую условиям ИТ-ипотеки. Сменять работодателя можно неограниченно. Если за полгода подходящую работу найти не удалось, ставка пересчитывается: ключевая ставка ЦБ на дату заключения кредитного договора + 2,5%."},{"q":"Можно ли использовать материнский капитал в качестве первоначального взноса по IT-ипотеке?","a":"Да. Материнский капитал принимается в первоначальный взнос или на погашение уже выданного кредита."},{"q":"Можно ли оформить IT-ипотеку, если клиент (или супруг) уже был участником ИТ-ипотеки или любой другой госпрограммы после 23.12.2023, а затем вышел из программы (погасил кредит)?","a":"В случае, если клиент был участником ИТ-ипотеки, оформить новую ИТ-ипотеку нельзя. Семейной программой воспользоваться возможно, при условии рождения ребёнка после даты заключения кредитного договора по ИТ-ипотеке."}]},{"topic":"Военная ипотека","qa":[{"q":"В каких банках можно оформить военную ипотеку или семейную военную ипотеку?","a":"Сбер, Банк ВТБ, Промсвязьбанк и Банк Россия. Семейную можно оформить в банках: Промсвязьбанк и Банк Россия"},{"q":"Может ли заёмщик дополнить первоначальный взнос собственными денежными средствами?","a":"Да."},{"q":"Можно ли использовать материнский капитал в составе первоначального взноса?","a":"Да."},{"q":"Как скачать свидетельство (документы) НИС?","a":"На официальном сайте Росвоенипотека — в разделе «Для участников НИС» с помощью последних 10 цифр 20-значного регистрационного номера участника НИС и даты рождения."},{"q":"Можно ли оформить жильё в общую долевую собственность с официальным супругом/супругой?","a":"Нет. Супруг/супруга исключается нотариальным согласием."},{"q":"Можно ли исключить супруга из сделки, и не теряет ли он/она свои права при военной ипотеке?","a":"Исключить возможно, право не теряет, при наличии сертификата НИС."},{"q":"Какова максимальная сумма кредита?","a":"В зависимости от банка, программы, возраста. По стандартной программе до 2 448 000 рублей, по семейной программе — 5 365 000 рублей."},{"q":"Можно ли субсидировать военную ипотеку (снизить ставку)?","a":"Нет. Субсидировать военную ипотеку нельзя."},{"q":"Можно ли рефинансировать стандартную (гражданскую) ипотеку в военную?","a":"Нет. Рефинансировать стандартную ипотеку на военную нельзя."},{"q":"Можно ли перейти с рассрочки застройщика на военную ипотеку?","a":"Нет."},{"q":"Каков максимальный срок кредита по военной ипотеке?","a":"Срок кредита устанавливается в сертификате НИС."}]}], STEPS=[["Шаг 1. Проверь сделку перед передачей брокеру","Имя клиента; контактный номер и с кем связываться; итоговая стоимость квартиры и применённые скидки; ипотечная программа; срок и ставка при субсидировании; первоначальный взнос; предпочтения по банку; краткие заметки о ситуации клиента."],["Шаг 2. Переведи сделку","Переведи сделку на этап «Подать на ипотеку» через кнопку «Брокер без брони»."],["Шаг 3. Создай чат при необходимости","При необходимости создай чат с клиентом и всеми участниками сделки."],["Шаг 4. Следи за статусом","Ипотечный брокер свяжется с клиентом в день передачи. Если нужно связаться в определённое время — укажи это в задаче. На этапе сбора документов может потребоваться помощь менеджера. Решения банков брокер вносит в AMP CRM во вкладку «Ипотека подана»."],["Шаг 5. Одобрено — передай в оформление","Свяжись с клиентом, согласуй параметры сделки, проверь размер и дату первоначального взноса, особенности выделения долей и срок выхода на сделку. После согласования передай сделку в отдел оформления."]], CALCS=[["Семейная ипотека","https://strana-ipoteka.github.io/strana-semeynaia-ipoteka.github.io/"],["Базовый калькулятор","https://docs.google.com/spreadsheets/d/1GcQEbyyR52jR16CqF function faqPlural(n){return n%10===1&&n%100!==11?'вопрос':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'вопроса':'вопросов'}
function faqQuestion(q,i){

function renderFaq(){
 const n=query.toLocaleLowerCase('ru').trim(),active=FAQ.find(t=>t.topic===filter);
 const entries=FAQ.flatMap(t=>t.qa.map(item=>({...item,topic:t.topic}))).filter(q=>(!active||q.topic===active.topic)&&(!n||(q.q+' '+q.a+' '+q.topic).toLocaleLowerCase('ru').includes(n)));
 const results=document.getElementById('results'),count=document.getElementById('matches'),categories=document.getElementById('faq-categories');
 if(!results||!count)return;
 const searching=!!n;
 if(categories)categories.hidden=searching;
 results.hidden=!active&&!searching;
 count.textContent=searching?'Найдено вопросов: '+entries.length:active?'В разделе: '+active.qa.length+' '+faqPlural(active.qa.length):'Выберите одну из '+FAQ.length+' тем';
 const show=entries.length?entries.map((q,i)=>searching&&!active?'<section class="faq-search-group"><span class="faq-result-topic">'+esc(q.topic)+'</span>'+faqQuestion(q,i)+'</section>':faqQuestion(q,i)).join(''):'<p class="empty">Ничего не найдено. Попробуйте другой запрос.</p>';
 results.innerHTML=show;
 results.querySelectorAll('[data-faq-copy]').forEach(button=>{
  button.onclick=()=>{
   const q=entries[Number(button.dataset.faqCopy)];
   const copyText=q.q+'\n'+q.a;
   if(!navigator.clipboard){button.textContent='Копирование недоступно';return}
   navigator.clipboard.writeText(copyText).then(()=>{button.textContent='Скопировано'},()=>{button.textContent='Не удалось скопировать'});
  };
 });
 document.getElementById('faq-clear').hidden=!searching;
}

let embeddedResizeObserver=null;
function embeddedSection(section){
 if(embeddedResizeObserver){embeddedResizeObserver.disconnect();embeddedResizeObserver=null;}
 const version = {'banks-memo':'20261127-1',documents:'20261127-1'}[section.id];
 const query=version?'?embedded=1&v='+version:'?embedded=1';
 app.innerHTML='<div class="embedded-section"><div class="embedded-nav"><a class="back" href="#home">← Назад к разделам</a></div><iframe class="embedded-frame" title="'+esc(section.title)+'" src="'+esc(section.url+query)+'" loading="eager"></iframe></div>';
 const frame=app.querySelector('.embedded-frame');
 frame.addEventListener('load',()=>{
  if(!frame.isConnected)return;
  try{
   const child=frame.contentDocument;
   if(!child||!child.body)return;
   const resize=()=>{
    if(!frame.isConnected)return;
    const needed=Math.max(480,Math.ceil(child.body.getBoundingClientRect().height)+8);
    if(Math.abs(frame.offsetHeight-needed)>3)frame.style.height=needed+'px';
   };
   resize();
   if(window.ResizeObserver){
    embeddedResizeObserver=new ResizeObserver(resize);
    embeddedResizeObserver.observe(child.body);
   }
   frame.contentWindow.addEventListener('hashchange',resize);
  }catch(error){frame.style.height='78vh';}
 });
}
function route(){
 const id=decodeURIComponent(location.hash.slice(1)||'home');
 const section=SECTIONS.find(item=>item.id===id);
 if(embeddedResizeObserver){embeddedResizeObserver.disconnect();embeddedResizeObserver=null;}
 if(section&&section.url&&section.url.startsWith('./'))embeddedSection(section);
 else if(id==='home')home();
 else if(id==='faq')faq();
 else if(id==='navigator')navigatorPage();
 else if(id==='calculators')calculators();
 else if(id==='insurance')insurance();
 else if(id==='team')team();
 else home();
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
